  /recharges/reservations:
    get:
      tags: [Recharges]
      summary: ListRechargeReservations — リチャージ予約一覧
      description: |
        顧客のリチャージ予約一覧を取得します。ICCID / SIM ID やステータスでのフィルタリングが可能です。
        `sim_id` と `iccid` を異なる値で両方指定した場合は `400` / `BAD_REQUEST` になります。
      operationId: ListRechargeReservations
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - $ref: "#/components/parameters/IccidQuery"
        - $ref: "#/components/parameters/SimIdQuery"
        - name: status
          in: query
          description: |
            ステータスでフィルタ。大文字始まりの値のみ受け付けます（小文字を指定すると 400）。
            取り消し済み（`Cancelled`）の予約は一覧に含まれないため、フィルタ値としても指定できません。
          schema:
            type: string
            enum: [Reserved, Executed, Failed]
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationsResponse"
              example:
                reservations:
                  - reservation_id: "RR-00012"
                    iccid: "8981080321000912770"
                    plan_code: "OI061331"
                    status: Executed
                    reserved_at: "2026-03-10T10:30:00Z"
                    executed_at: "2026-03-10T10:30:02Z"
                total_count: 1
                page_size: 200
                has_more: false
                next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
    post:
      tags: [Recharges]
      summary: CreateRechargeReservation — リチャージ予約作成
      description: |
        SIM に対するリチャージ予約を作成します。1つの SIM に対して最大3件の予約が可能です。

        **受付期限** — 利用終了日の当日に限り、**19:00（JST）以降の予約は受け付けません**
        （`400` / `BAD_REQUEST` / `Reservation is not accepted after 19:00 on the last day`）。
        利用終了日より前であれば時刻による制限はありません。利用終了日当日に行われる
        リチャージの実行処理（下記 20:00 / 21:00）に予約を確実に間に合わせるための締切です。

        **実行タイミング** — 予約したリチャージが実際に適用されるタイミングはプランタイプによって異なります。

        - `capacity`（容量上限型）：残データ量が 500MB 未満になった時点、または利用終了日の 21:00（JST）以降
        - `daily`（日次上限型）：利用終了日に到達後、毎日 20:00（JST）の日次処理で実行（残データ量による判定なし）

        ※ 上限が 500MB 以下の小容量プランでは、上限に到達した時点で実行されます。

        予約直後は `status` が `Reserved` となり、実行後に `Executed` へ変わります。

        **予約できない条件** — 以下に該当する場合は予約が作成されず、`errorCode` 付きのエラーになります。

        | HTTP | errorCode | 条件 |
        |---|---|---|
        | 400 | `BAD_REQUEST` | SIM ID の形式不正（19-20 桁の数字）/ 存在しない・無効な `plan_code` / 解約済み SIM（`SIM is terminated`）/ リチャージ対象外プラン / 利用終了日当日の 19:00（JST）以降（`Reservation is not accepted after 19:00 on the last day`） |
        | 400 | `LIMIT_EXCEEDED` | 未実行（`Reserved`）の予約が上限 3 件に到達している |
        | 400 | `PLAN_MISMATCH` | 容量上限型と日次上限型の混在 / 日次上限型で 1 日あたり容量・リセット周期が現行プランと不一致 |
        | 400 | `REALM_MISMATCH` | プランのレルムが SIM の現行レルムと不一致（通信断防止のため拒否） |
        | 403 | `FORBIDDEN` | 指定 SIM を当該顧客が所有していない |
        | 404 | `NOT_FOUND` | 指定 SIM が登録されていない |
        | 400 | `VALIDATION_ERROR` | `plan_code` の不足・型不正などリクエストボディの不正 |

        `sim_id`（または `iccid`）が未指定の場合と、`sim_id` と `iccid` を異なる値で両方指定した場合も
        `400` / `BAD_REQUEST` になります（`message` は `iccid or sim_id is required` /
        `iccid and sim_id both provided but differ; ...`）。

        予約上限にカウントされるのは `status` が `Reserved` の予約のみです。`Executed` や取り消し済みの
        予約は含まないため、3 件予約済みでもそのうち 1 件が実行されれば次の予約を作成できます。
      operationId: CreateRechargeReservation
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
            example:
              sim_id: "8981080321000912770"
              plan_code: "OI061331"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              example:
                reservation_id: "RR-00012"
                status: Reserved
                reserved_at: "2026-03-10T10:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /recharges/immediate:
    post:
      tags: [Recharges]
      summary: CreateImmediateRecharge — 即時リチャージ（プラン即時書換・残量リセット）
      description: |
        ICCID とプランコードを指定して、**即時にプラン書換・残量リセット・PCRF 1 回 sync** を実行します。
        容量型プランのみ対象（日次型・CPFR・Internal はエラー）。予約の作成と実行をその場で行い、
        予約は即 `Executed` 化されます。

        `force=true` で既存 `Reserved` 予約を `Cancelled` 化して前倒し実行します。
        PCRF 同期中（`SyncStatus=実行中`）は force 不問で `409 ALREADY_SYNCING`。

        `sim_id`（または `iccid`）が未指定の場合は `400` / `INVALID_ICCID`、`sim_id` と `iccid` を
        異なる値で両方指定した場合は `400` / `INVALID_REQUEST` になります。
      operationId: CreateImmediateRecharge
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImmediateRechargeRequest"
            example:
              sim_id: "8981080301011327143"
              plan_code: "OI071522"
              force: false
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmediateRechargeResponse"
              example:
                iccid: "8981080301011327143"
                plan_code: "OI071522"
                status: Executed
                reservation_id: "a1XRB000005P7Q12AK"
                sync_status: 実行中
                superseded_reservation_ids: []
                message: "Immediate recharge executed. PCRF sync triggered."
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 指定 SIM に対するリチャージ権限がありません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 進行中予約あり、もしくは PCRF 同期中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          description: 累積 usage 取得失敗（DML 前に中断）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key

  parameters:
    CustomerCode:
      name: customer_code
      in: query
      description: |
        9桁の顧客コード。省略時は認証情報に紐づく顧客コードを使用します。
        指定する場合は認証情報のスコープと一致している必要があり、不一致の場合は 403 を返します。
      schema:
        type: string
        pattern: '^\d{9}$'
        example: "110139701"
    HeaderLang:
      name: header_lang
      in: query
      description: |
        CSV のヘッダー行（列名）の言語。

        - `en`（既定）: 英字の列名。これまでと同じ出力です
        - `ja`: 日本語の列名。列ごとの対応は各エンドポイントの説明にあります

        日本語になるのはヘッダー行だけです。値（日付・`true` / `false`・区分値など）と、
        列の数・並びは `en` と同じです。
      schema:
        type: string
        enum: [en, ja]
        default: en
    PageSize:
      name: page_size
      in: query
      description: 1ページあたりの件数
      schema:
        type: integer
        default: 200
    Cursor:
      name: cursor
      in: query
      description: ページネーションカーソル
      schema:
        type: string
    IccidQuery:
      name: iccid
      in: query
      deprecated: true
      description: SIM の ICCID でフィルタ。`sim_id` と併用された場合は `iccid` を優先
      schema:
        type: string
    SimIdQuery:
      name: sim_id
      in: query
      description: SIM ID (ICCID のエイリアス) でフィルタ
      schema:
        type: string
    SimIdPrefixFilter:
      name: sim_id
      in: query
      description: |
        SIM 識別子（`sim_id`）の**前方一致**で絞り込みます（#76）。

        - **英数字**・32 文字以内。条件を満たさない値（記号を含むもの）・空文字は **400**
        - **小文字は大文字として扱います**（`ab123` と `AB123` は同じ結果）。
          格納値が英大文字と数字のみのためです
        - ⚠️ **`sim_id` は ICCID とは限りません。** 19 桁の数字（ICCID）と、
          英大文字 2 文字 + 数字 13 桁の 15 桁の識別子が混在し、後者が約 37% を
          占めます（2026-08-21 本番実測）。前方一致の桁数を ICCID 前提で
          決め打ちしないでください
        - 他の絞り込み条件とは **AND** で結合します

        ⚠️ **`/v1/recharges/sims` の `sim_id` とは一致方式が違います。**
        あちらは**完全一致**（`recharges/lambda_function.py` のクライアント側フィルタ）で、
        こちらは前方一致です。同じパラメータ名なので取り違えに注意してください。
      schema:
        type: string
        pattern: '^[0-9A-Za-z]+$'
        maxLength: 32
        example: "8981080"
    MsisdnPrefixFilter:
      name: msisdn
      in: query
      description: |
        電話番号（MSISDN）の**前方一致**で絞り込みます（#76）。

        処理は次の順序で行います（`pattern` は入力の形を緩く示したものなので、
        受理されるかどうかはこの順序が決めます）:

        1. **区切り文字（ハイフン `-`・半角/全角スペース・括弧 `(` `)`）を除去**します
           （`070-1234-5678` と `07012345678` は同じ結果）
        2. **国番号に変換**します。先頭の `+` は落とし（`%2B8140` → `8140`）、
           先頭が `00` ならそれを落とし（`00819012` → `819012`）、
           先頭が `0` なら `81` に置き換えます（`07012` → `817012`）。
           `mc_sims.msisdn` が国番号付き（`8140...`）で格納されているためです
        3. **変換後の値**を検証します。数字のみ・空でない・**32 文字以内**であること。
           満たさない場合は **400**（全角数字・記号を含む値、`---` のように除去すると
           空になる入力、変換後に 32 文字を超えるものが該当）

        先頭の `+` は、生の `+` でもパーセントエンコード（`%2B`）でも同じ結果になります
        （前者は空白としてデコードされたうえで、1. の区切り文字として除去されるため）。
      schema:
        # 区切り文字を含む入力も受け付ける。数字のみ・32 文字以内の判定は
        # 区切り文字を除いた後の値に対して行われるため、maxLength は置かない。
        type: string
        pattern: '^\+?[0-9()\- 　]+$'
        example: "070-1234-5678"

  schemas:
    # ----- SIM -----
    Sim:
      type: object
      description: |
        `GET /v1/sims` の応答。`mc_sims` ビューの 45 列に対応する
        （ビューは 47 列で、うち `activation_code` / `puk2` の 2 列は API・CSV とも出力しない。
        `puk1` / `user_id` / `password` は 2026-09 の更新で出力するようになりました）。
        明細 `GET /v1/sims/{sim_id}` は、これに `note` と `lines_temporary_stop` を足した `SimDetail` を返す。

        `filter_nulls=true`（既定）のとき、値が null のフィールドは **キーごと応答から消える**
        （`null` として返るのではない）。`nullable: true` が効くのは `filter_nulls=false` のとき。
      properties:
        sim_id:
          type: string
          description: |
            SIM 識別子（`sf.inventory.Name`）。**ICCID とは限りません。**
            19 桁の数字（ICCID）と、英大文字 2 文字 + 数字 13 桁の 15 桁の識別子が
            混在し、後者が約 37% を占めます（2026-08-21 本番実測）。
        customer_code:
          type: string
          description: 顧客コード（9桁）
        application_start_date:
          type: string
          format: date
          nullable: true
          description: 申込開始日
        cancellation_mobile_core_date:
          type: string
          format: date
          nullable: true
          description: モバイルコア解約日
        carrier_opening_date:
          type: string
          format: date
          nullable: true
          description: キャリア開通日
        carrier_withdrawal_date:
          type: string
          format: date
          nullable: true
          description: キャリア脱退日
        communication_generation:
          type: string
          nullable: true
          description: 通信世代（4G/5G 等）
        dns_primary:
          type: string
          nullable: true
          description: プライマリ DNS
        dns_secondary:
          type: string
          nullable: true
          description: セカンダリ DNS
        extension_end_date:
          type: string
          format: date
          nullable: true
          description: 延長終了日
        first_communicating_date:
          type: string
          format: date
          nullable: true
          description: 初回通信日
        imsi:
          type: string
          description: IMSI。実データでは 38% が空文字
        ip_address:
          type: string
          nullable: true
          description: IP アドレス
        ip_address_type:
          type: string
          nullable: true
          description: IP アドレス種別
        ipv6_address_dns_primary:
          type: string
          description: IPv6 プライマリ DNS。実データでは 100% が空文字
        ipv6_address_dns_secondary:
          type: string
          description: IPv6 セカンダリ DNS。実データでは 100% が空文字
        ipv6_address:
          type: string
          description: IPv6 アドレス。実データでは 100% が空文字
        line_category:
          type: string
          nullable: true
          description: 回線種別
        line_status_from_mc:
          type: string
          nullable: true
          description: MC 側の回線状態
        line_stoped_date:
          type: string
          format: date
          nullable: true
          description: 回線停止日
        lines_status:
          type: string
          nullable: true
          description: 回線状態
        linestarted_date:
          type: string
          format: date
          nullable: true
          description: 回線開始日
        opening_date:
          type: string
          format: date
          nullable: true
          description: 開通日
        puk1:
          type: string
          nullable: true
          description: |
            PUK1（PIN ロック解除コード）。SIM の PIN を 3 回連続で誤入力してロックした際の
            解除に使います。**取り扱いにご注意ください。**
        user_id:
          type: string
          nullable: true
          maxLength: 40
          description: |
            APN 認証のユーザ ID。APN 設定時に `apn` / `password` と組で使います。
            **取り扱いにご注意ください。**
            値が無い SIM では空文字が返ることがあります（`null` に寄せません）。
        password:
          type: string
          nullable: true
          description: |
            APN 認証のパスワード。APN 設定時に `apn` / `user_id` と組で使います。
            **取り扱いにご注意ください。**
        msisdn:
          type: string
          description: 電話番号。実データでは 11% が空文字
        realm:
          type: string
          nullable: true
          description: レルム
        service_category:
          type: string
          nullable: true
          description: サービス種別
        use_start_expiration_date:
          type: string
          format: date
          nullable: true
          description: 利用開始期限
        shipping_date:
          type: string
          format: date
          nullable: true
          description: 出荷日
        apn:
          type: string
          description: APN。実データでは 24% が空文字
        active_plan_name:
          type: string
          description: 現在適用中のプラン名（商談商品名）。`plan_detail` に相当する。実データでは 15% が空文字
        product_name:
          type: string
          description: 商品名。実データ上 `active_plan_name` と同値。実データでは 15% が空文字
        sim_category:
          type: string
          nullable: true
          description: SIM 種別
        product_name_id:
          type: string
          description: 商品名 ID。名称に反して ID ではなく、`product_name` とは別の商品名が入る。実データでは 15% が空文字
        status:
          type: string
          enum: [stock, ready, active, inactive, terminated, unknown]
          description: |
            回線状態。Salesforce の状態フィールドから CASE 式で導出されます。次の順に評価し、
            最初に当てはまった値になります。

            1. `terminated`: `lines_status` が解約
            2. `stock`: 在庫状態（API には含まれない項目）が在庫で、`shipping_date` が無い
            3. `ready`: `lines_status` が開通で、`shipping_date` がある
            4. `active`: `lines_status` と `line_status_from_mc` がどちらも開通で、`opening_date` がある
               （`shipping_date` があれば 3. の `ready` が先に当たる）
            5. `inactive`: `lines_status` が停止、または SS 側の回線状態（API には含まれない項目。
               `lines_state_ss_for_mypage` とは別の項目）が停止中
            6. `unknown`: 上記のいずれにも該当しない

            一時停止の処理中（`lines_status` は停止、`line_status_from_mc` はまだ開通）の回線は
            `inactive` になります（#126）。

            **`SimSummary` との対応**: `ready` / `active` / `terminated` / `unknown` は共通ですが、
            `stock` と `inactive` はサマリに出力されません。逆にサマリの `subscribed` は
            `status <> 'terminated'` の集計値で、この enum には対応する値がありません（#16）。

            ⚠️ **`active` の件数を稼働回線数として扱わないでください。** 評価順の都合で
            `ready` の条件が先に当たるため、実際に稼働している回線の大半が `ready` に分類されます
            （本番でも `active` はごく少数です）。
            この判定ロジックの見直しは #28 で扱います。
        session_status:
          type: string
          enum: [online, offline]
          description: セッション接続状態。開始済みかつ未終了の CDR がある場合に `online`
        session_created_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-18T22:54:11Z"
          description: |
            最新セッションの開始時刻（UTC・秒精度）。セッション履歴が無い場合は `null`。
        session_terminated_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-18T22:54:11Z"
          description: |
            最新セッションの終了時刻（UTC・秒精度）。セッションが継続中、または
            セッション履歴が無い場合は `null`。
        lines_state_ss_for_mypage:
          type: string
          example: "未開通"
          description: |
            回線状態（Salesforce `LinesStateSSForMypage__c`）。回線種別で分岐する数式項目で、
            Magic マイページが表示している値そのものです。**画面表示にはこちらを使ってください。**

            ⚠️ `lines_status` とは一致しません。mih sandbox の実測（2026-09-15）では
            SIM 138 件中 71 件（51%）で `lines_status='開通'` に対して本項目が `未開通` でした。

            本番実測（2026-09-16・207 万行）では `null` も空文字もゼロ件で、常に値が入ります。
        product_code:
          type: string
          example: "MC-PLAN-001"
          description: |
            商品コード（Salesforce `productCode__c`）。

            値が無い場合は**空文字**が返ります（`null` にはなりません）。
            本番実測（2026-09-16）で 15.8% が空文字。
        quotation_application_number:
          type: string
          example: "Q-2026-000123"
          description: |
            見積・申込番号（Salesforce `QuotationApplicationNumber__c`）。

            値が無い場合は**空文字**が返ります（`null` にはなりません）。
            本番実測（2026-09-16）で 15.8% が空文字。
        tel:
          type: string
          nullable: true
          example: "04011001010"
          description: |
            電話番号の**国内表記**（Salesforce `tel__c`）。
            `msisdn` は同じ番号の国際表記（例 `814011001010`）で、両方返ります。

            ⚠️ SIM の突き合わせや前方一致検索（`?msisdn=`）には `msisdn` を使ってください。

            ⚠️ **必須キーとして扱わないでください。** 本番実測（2026-09-16・207 万行）で
            **12.4%（約 25 万 SIM）が `null`** です（空文字はゼロ件）。
            `filter_nulls=true`（既定）ではこれらの SIM で**キーごと落ちます**。
            `filter_nulls=false` なら `null` が返ります。
        sim_stock_status:
          type: string
          nullable: true
          example: "白"
          description: |
            SIM 状態（Salesforce `status__c`。`白` / `半黒` / `黒`）。

            ⚠️ 回線状態を表す `status`（`active` / `ready` / …）とは**別物**です。
            CSV エクスポートでも両方の列が並ぶため、列名を分けています。

            本番実測（2026-09-16）で 0.14% が `null`（空文字はゼロ件）。
            `filter_nulls=true`（既定）ではキーごと落ちます。

    SimDetail:
      description: |
        `GET /v1/sims/{sim_id}` の応答。`Sim` の全フィールドに加えて `note` と
        `lines_temporary_stop` を返す。

        `note` は明細でのみ返る。`GET /v1/sims`（一覧）と CSV エクスポートには
        含まれない（#57）。自由記述の備考を顧客向け CSV に混ぜないため、
        明細専用のビュー `mc_sim_detail` に分けている。
      allOf:
        - $ref: "#/components/schemas/Sim"
        - type: object
          properties:
            note:
              type: string
              nullable: true
              maxLength: 255
              example: "不良SIMのため交換対応済み"
              description: |
                備考。単一の上書き型メモで、履歴・作成者・更新時刻は持たない。

                備考が無い SIM では `filter_nulls=true`（既定）なら **キーごと落ち**、
                `filter_nulls=false` なら `null` が返る。どちらも「備考なし」を意味し、
                クライアントは両者を区別しない。**空文字は返らない**（空は `null` に寄せる）。
            lines_temporary_stop:
              type: boolean
              nullable: true
              example: true
              description: |
                回線の一時停止フラグ（Salesforce `Inventory__c.LinesTemporaryStop__c` の値をそのまま返す）。

                明細でのみ返る。`GET /v1/sims`（一覧）と CSV エクスポートには含まれない。
                `false` は `filter_nulls=true`（既定）でも落ちない。値が無い SIM では
                `filter_nulls=true` ならキーごと落ち、`filter_nulls=false` なら `null` が返る。

    SimCount:
      type: object
      description: |
        `GET /v1/sims` と同じ絞り込みに一致する `mc_sims` ビューの行数。
        SIM の枚数ではありません。
      required: [count]
      properties:
        count:
          type: integer
          description: 一致した行数

    SimSummary:
      type: object
      description: |
        顧客に紐づく SIM のステータス別集計。各件数は `mc_sims` の行数を数えたもの。
        表示対象は `GET /v1/sims` と同じ（表示対象外の在庫は数えない）。
        表示対象の在庫が 1 件も無い顧客では、空のオブジェクト `{}` を返す
        （`customer_code`・各件数・`updated_at` のいずれのキーも含まない）。
      properties:
        customer_code:
          type: string
          description: 顧客コード
        total:
          type: integer
          description: 全件
        subscribed:
          type: integer
          description: 解約以外（在庫・停止を含む）
        ready:
          type: integer
          description: 開通済みで出荷済み
        active:
          type: integer
          description: '`status` が `active` の件数（条件は `Sim.status` を参照。稼働回線数ではない）'
        online:
          type: integer
          description: セッション接続中
        terminated:
          type: integer
          description: 解約済み
        unknown:
          type: integer
          description: 上記のいずれにも該当しない
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: |
            集計元データ（`sf.inventory`）の最終更新時刻。当該顧客のレコードのうち
            Salesforce 上で最後に更新されたものの時刻を返す（同期パイプラインの実行時刻ではない）。
            表示対象外の在庫（端末など）の更新も含む。対象レコードが無い場合は null。

    # ----- Statistics -----
    MonthlyUsage:
      type: object
      properties:
        year_month:
          type: string
          description: "YYYYMM 6 桁ゼロ埋め"
          example: "202603"
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer

    SimMonthlyUsage:
      allOf:
        - type: object
          properties:
            sim_id:
              type: string
            customer_code:
              type: string
            tel:
              type: string
              nullable: true
              example: "04011001010"
              description: |
                電話番号の国内表記（`sf.inventory.tel__c`）。

                ⚠️ 本 EP は `mc_stats_monthly` を `SELECT *` で読むため、ビューに列が
                増えると応答も増えます。ここに挙げていない列が返ることがあります。
            last_updated_at:
              type: string
              format: date-time
              nullable: true
              example: "2026-08-31T14:48:12Z"
              description: |
                集計元レコード（Salesforce の使用実績）の最終更新時刻（UTC・秒精度）。
                同期パイプラインの実行時刻ではありません。
            reissue_category:
              type: string
              nullable: true
              enum: ["new", "old", "total", null]
              description: |
                SIM 再発行が発生した月のみ値が入る。通常月は `null`。
                - `new`: 再発行後の通信量
                - `old`: 再発行前の通信量（旧 Inventory 配下）
                - `total`: 旧 + 新 の合算行
        - $ref: "#/components/schemas/MonthlyUsage"

    MonthlyUsageBySim:
      type: object
      properties:
        sim_id:
          type: string
          nullable: true
          description: "view は LEFT JOIN のため、参照先の sf.inventory 行が無い場合は null になりうる。"
        year_month:
          type: string
          description: "YYYYMM 6 桁ゼロ埋め"
          example: "202608"
        msisdn:
          type: string
          nullable: true
          description: "sf.inventory.MSISDN__c は NULL 可 (dev 実測 7%)。国際表記 (例 814011001010)。"
        tel:
          type: string
          nullable: true
          example: "04011001010"
          description: |
            電話番号の**国内表記**（`sf.inventory.tel__c`）。`msisdn` は同じ番号の国際表記で、
            両方返ります。

            ⚠️ **必須キーとして扱わないでください。** `sf.inventory.tel__c` 自体が
            本番実測（2026-09-16・207 万行）で 12.4% `null` であるうえ、view は
            LEFT JOIN なので参照先の行が無い場合も `null` になります。
        plan_name:
          type: string
          nullable: true
          description: "sf.use_achievement.PlanName__c は view の WHERE で絞っていないため NULL 可。"
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer
        total_bytes:
          type: integer
          description: "サーバ側で `downlink_bytes + uplink_bytes` を計算した値。片方 NULL の場合はもう一方の値。"
        reissue_category:
          type: string
          nullable: true
          enum: ["new", "old", "total", null]
          description: |
            SIM 再発行が起きた月に Salesforce が作る 3 行の種別。通常行は `null`。
            - `new`: 再発行後の通信量
            - `old`: 再発行前の通信量（旧 Inventory 配下）
            - `total`: 旧 + 新 の合算行（新 Inventory と同じ `(sim_id, year_month)` に載る）

    SimDailyUsage:
      type: object
      properties:
        sim_id:
          type: string
          description: SIM 識別子 (ICCID)
        msisdn:
          type: string
        customer_code:
          type: string
        date:
          type: string
          format: date
          description: 対象日 (JST カレンダー日)
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer
        total_bytes:
          type: integer
        is_confirmed:
          type: boolean
          description: |
            該当日の値の確定度。`true` = 日次集計（1DAY）で確定済み。
            `false` = 未確定で、`date` が「`checked_at` を JST に変換した日付」の前日以降なら
            5 分粒度集計（5MINS）由来の速報値、それより古い日は補完対象外のため値が不明
            （`0` を「通信なし」として扱わないこと）。
            `date` は JST の日付、`checked_at` は UTC 表記なので、比較の前に TZ を揃えること。
            詳細はエンドポイントの description を参照。
        checked_at:
          type: string
          format: date-time
          description: |
            集計を実行した時刻。**UTC 表記（`YYYY-MM-DDTHH:MM:SSZ`）** で返ります。

            `date` は JST の日付なので、両者を比較する場合は `checked_at` を
            JST（UTC + 9 時間）に変換してください。
        data_through:
          type: string
          format: date
          description: 日次集計が確定している最終日

    SimDailyUsageExport:
      type: object
      description: |
        `GET /v1/stats/sims/{sim_id}/daily_usage/export` の応答。CSV 本体は
        `download_url` からダウンロードします。
      required:
        - file_name
        - row_count
        - download_url
        - expires_in_seconds
        - data_through
      properties:
        file_name:
          type: string
          description: S3 に配置したファイル名。
        row_count:
          type: integer
          minimum: 0
          description: CSV のデータ行数 (ヘッダ行を除く)。0 のときはヘッダのみ。
        download_url:
          type: string
          format: uri
          description: 署名付きダウンロード URL（24 時間有効）。ホストは S3 または CloudFront。
        expires_in_seconds:
          type: integer
          description: 署名付きダウンロード URL の有効秒数。
        data_through:
          type: string
          format: date
          nullable: true
          description: |
            日次集計が確定している最終日。全行同値のため CSV 列でなく本フィールドに 1 度だけ含めます。
            **0 件のときは `null`**（集計状態を返す情報源が無いため）。

    CdrRecord:
      type: object
      properties:
        sim_id:
          type: string
        customer_code:
          type: string
        record_begins_at:
          type: string
          format: date-time
        session_created_at:
          type: string
          format: date-time
          nullable: true
        session_deleted_at:
          type: string
          format: date-time
          nullable: true
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer

    CumulativeUsage:
      allOf:
        - $ref: "#/components/schemas/CustomerCumulativeUsage"
      description: |
        `GET /v1/stats/sims/{sim_id}/cumulative_usage` の 1 要素。
        フィールド構成は `CustomerCumulativeUsage` と同一。

    CustomerCumulativeUsage:
      type: object
      properties:
        sim_id:
          type: string
          description: SIM 識別子 (ICCID)
        customer_code:
          type: string
        msisdn:
          type: string
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer
        total_bytes:
          type: integer
          description: 生涯通算の通信量（`downlink_bytes` + `uplink_bytes`）
        checked_at:
          type: string
          format: date-time
          example: "2026-08-14T06:45:49Z"
          description: この値を算出した時刻（UTC・秒精度）
        latest_record_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-14T06:40:00Z"
          description: 集計に含まれた最新の通信記録の時刻（UTC・秒精度）

    CurrentPlanUsage:
      type: object
      properties:
        sim_id:
          type: string
          description: SIM 識別子 (ICCID)
        customer_code:
          type: string
        msisdn:
          type: string
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer
        total_bytes:
          type: integer
          description: 累積通信量
        checked_at:
          type: string
          format: date-time
          example: "2026-08-14T06:45:49Z"
          description: この値を算出した時刻（UTC・秒精度）
        latest_record_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-14T06:40:00Z"
          description: 集計に含まれた最新の通信記録の時刻（UTC・秒精度）
        plan_code:
          type: string
          nullable: true
          description: 最新の Executed リチャージ予約のプランコード
        plan_started_at:
          type: string
          format: date-time
          nullable: true
          description: 現プラン開始時刻 (最新 Executed リチャージ予約の実行日時)
        usage_offset_bytes:
          type: integer
          nullable: true
          description: プラン適用時点の累積通信量
        current_plan_used_bytes:
          type: integer
          nullable: true
          description: 現プランでの消費量 = total_bytes − usage_offset_bytes (offset 不明時は null)

    # ----- Exports -----
    ExportAsync:
      type: object
      properties:
        file_name:
          type: string
        download_url:
          type: string
        message:
          type: string
        expires_in_seconds:
          type: integer

    ExportSync:
      type: object
      properties:
        file_name:
          type: string
        row_count:
          type: integer
        file_size_bytes:
          type: integer
        s3_url:
          type: string
        download_url:
          type: string

    # ----- Recharges -----
    RechargeSim:
      type: object
      properties:
        iccid:
          type: string
        product_code:
          type: string
        plan_type:
          type: string
          enum: [capacity, daily]
        extension_end_date:
          type: string
          format: date
        reservation_count:
          type: integer
        recharge_available:
          type: boolean
        usage_offset_bytes:
          type: integer
          description: |
            現プランの容量計算の起点バイト数（直近実行済み予約の通算転送容量オフセット）。
            `現プラン使用量 = 通算転送容量 − usage_offset_bytes` で算出。未リチャージ時は 0。

    RechargeSimsResponse:
      type: object
      properties:
        sims:
          type: array
          items:
            $ref: "#/components/schemas/RechargeSim"
        total_count:
          type: integer
        page_size:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true

    RechargeSimBalance:
      type: object
      description: |
        SIM の使える総量（現プラン容量 + 繰越）・残量・使用量。容量 3 値は capacity プランのみ値を持ち、
        daily プランおよび総枠未確定時（初回リチャージ前・プランマスタ未登録等）は `null` を返します。
        daily プランは代わりに当日枠（`daily_*`）を返します。
        全プランタイプで同一スキーマのため、該当しない項目は `null` として含まれます。
      properties:
        iccid:
          type: string
          description: SIM 識別子（ICCID）。リクエストパスの `sim_id` と同じ値
        plan_type:
          type: string
          nullable: true
          enum: [capacity, daily, null]
          description: 現在適用中のプラン種別。現プランを特定できない場合（適用中プランが無い・不正等）は `null`
        total_granted_bytes:
          type: integer
          nullable: true
          description: >-
            付与容量（bytes）＝「◯GB 中 ◯GB 残り」の前者。
            現プラン容量 + 繰越（Banked Data）の合計。capacity プランのみ、それ以外は `null`
        total_remaining_bytes:
          type: integer
          nullable: true
          description: >-
            利用可能残量（bytes）＝「◯GB 中 ◯GB 残り」の後者。繰越分を含む。
            サーバ側で `0 ≤ remaining ≤ total_granted_bytes` および `used = granted − remaining`
            の整合を保証するため、利用者側での追加補正は不要。capacity プランのみ
        used_bytes:
          type: integer
          nullable: true
          description: 使用量（bytes、= `total_granted_bytes − total_remaining_bytes`）。capacity プランのみ
        banked_data_bytes:
          type: integer
          nullable: true
          description: >-
            繰越（未消化データ）残高（bytes）。`total_granted_bytes` / `total_remaining_bytes`
            に既に含まれる内訳であり、加算しないこと。繰越の払い出し中（`filler_state != NORMAL`）は
            0 になるが、総枠・残量は繰越分を含んだままなので表示は不連続にならない。capacity プランのみ
        filler_state:
          type: string
          enum: [NORMAL, FILLER_LARGE, FILLER_SMALL]
          description: Filler 状態。UI が「枯渇」と低速モードを区別する補助情報
        checked_at:
          type: string
          format: date-time
          description: 残量を確認した時刻（UTC、RFC 3339 / `...Z` 形式）
        latest_record_time:
          type: string
          format: date-time
          nullable: true
          description: >-
            残量算出に使った使用量データの最新記録時刻（UTC、RFC 3339 / `...Z` 形式）。
            通信実績が無い SIM や、使用量を参照しない状態（総枠未確定など）では `null`。
            daily プランでは当日分の集計に使った最新実績の時刻を返す
        daily_limit_bytes:
          type: integer
          nullable: true
          description: >-
            1 日あたりの上限（bytes）。daily プランのみ。
            日次上限のないプラン（無制限）、リセット周期が 1 日でないプラン、
            およびプラン情報から上限を判定できない場合は `null`
        daily_used_bytes:
          type: integer
          nullable: true
          description: >-
            当日利用量（bytes）。**日本時間 0:00 以降**の実績の合計で、日付が変わると 0 に戻る。
            daily プランのみ。通信実績が無い SIM は `0`
        daily_remaining_bytes:
          type: integer
          nullable: true
          description: >-
            当日残量（bytes）＝ `daily_limit_bytes − daily_used_bytes`（0 未満にはならない）。
            daily プランのみ。`daily_limit_bytes` が `null` の場合は `null`
        error_code:
          type: string
          nullable: true
          description: 成功時（200）は常に `null`（エラー応答と共通の項目）
        message:
          type: string
          nullable: true
          description: 成功時（200）は常に `null`（エラー応答と共通の項目）

    Plan:
      type: object
      properties:
        plan_code:
          type: string
        plan_type:
          type: string
          enum: [capacity, daily]
        capacity_limit:
          type: number
          nullable: true
          description: GB 上限（capacity プランのみ）
        daily_limit:
          type: number
          nullable: true
          description: 日次 GB 上限（daily プランのみ）
        duration_days:
          type: integer
        plan_detail:
          type: string
          nullable: true
          description: プラン詳細（商談商品名）

    PlansResponse:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
        total_count:
          type: integer

    CreateReservationRequest:
      type: object
      required: [plan_code]
      description: |
        `iccid` または `sim_id` のいずれか必須。両指定 + 異なる値、または両欠落は 400 を返します。両指定 + 同値は許容。
      properties:
        iccid:
          type: string
          deprecated: true
          description: 対象 SIM の ICCID
        sim_id:
          type: string
          description: SIM ID（ICCID のエイリアス）
        plan_code:
          type: string
          description: リチャージプランコード

    Reservation:
      type: object
      description: |
        予約作成（`POST /recharges/reservations`）の応答。`executed_at` は含まれません。
      properties:
        reservation_id:
          type: string
          description: 予約 ID（`RR-00012` 形式）
        status:
          type: string
          description: |
            予約ステータス。`Reserved`（予約済み）/ `Executed`（実行済み）/
            `Failed`（失敗）。作成直後は `Reserved`。取り消し済みの予約は一覧に含まれません
          enum: [Reserved, Executed, Failed]
        reserved_at:
          type: string
          format: date-time

    ReservationDetail:
      allOf:
        - $ref: "#/components/schemas/Reservation"
        - type: object
          properties:
            iccid:
              type: string
            plan_code:
              type: string
            executed_at:
              type: string
              format: date-time
              nullable: true
              description: 実行日時（未実行時 null）

    ImmediateRechargeRequest:
      type: object
      required: [plan_code]
      description: |
        `iccid` または `sim_id` のいずれか必須。両指定 + 異なる値、または両欠落は 400 を返します。両指定 + 同値は許容。
      properties:
        iccid:
          type: string
          deprecated: true
          description: 対象 SIM の ICCID（19-20 桁）
        sim_id:
          type: string
          description: SIM ID（ICCID のエイリアス）
        plan_code:
          type: string
          description: 書き換え先プランコード（容量型のみ）
        force:
          type: boolean
          default: false
          description: |
            `true` のとき既存 `Reserved` 予約を Cancelled 化して前倒し実行する。
            既定 `false` の場合は進行中予約があると `409 RESERVATION_EXISTS`。

    ImmediateRechargeResponse:
      type: object
      description: |
        即時リチャージ結果（成功時）。`status='Executed'` で `reservation_id` 等が埋まる。
        エラー時はこのスキーマではなく `Error`（`detail` にオブジェクト）を返すため、
        成功応答に `error_code` フィールドは含まれない。
      properties:
        iccid:
          type: string
        plan_code:
          type: string
        status:
          type: string
          nullable: true
          description: 予約ステータス（成功時 `Executed`）
        reservation_id:
          type: string
          nullable: true
          description: 生成された予約レコード ID
        sync_status:
          type: string
          nullable: true
          description: Inventory の同期ステータス（成功時 `実行中` → 下流で `実行済`）
        superseded_reservation_ids:
          type: array
          items:
            type: string
          description: force で Cancelled 化した既存 Reserved 予約 ID
        message:
          type: string

    ReservationsResponse:
      type: object
      properties:
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/ReservationDetail"
        total_count:
          type: integer
        page_size:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true

    # ----- Common -----
    Error:
      type: object
      description: |
        エラー応答。`detail` は 2 形式のいずれかで、クライアントは両方を扱う必要があります。

        - **文字列** — SIMs / Stats / Exports、および全エンドポイント共通の `customer_code` の解決で返るエラー
          （400: `customer_code` と `customer_id` の不一致・未指定 / 401: 認証コンテキストなし /
          403: 認証スコープと不一致）
        - **オブジェクト** — Recharges の上記以外のエラー（`iccid` / `sim_id` の未指定・不一致、
          プラン詳細の 404 を含む）。中の `errorCode` / `message` はキャメルケースです

        API キーが不正・未指定の場合は API Gateway が応答するため、`detail` を持たない
        `{"message": "Forbidden"}` が返ります。
      properties:
        detail:
          oneOf:
            - type: string
            - type: object
              properties:
                errorCode:
                  type: string
                  description: |
                    エラーコード。`BAD_REQUEST`（汎用の入力・状態エラー）/
                    `LIMIT_EXCEEDED`（予約上限到達）/ `PLAN_MISMATCH`（プラン不整合）/
                    `REALM_MISMATCH`（レルム不整合）/ `FORBIDDEN`（権限なし）/
                    `NOT_FOUND`（対象なし）/ `VALIDATION_ERROR`（リクエストボディ不正）。
                    即時リチャージはこれとは別系統で `INVALID_REQUEST` / `INVALID_ICCID` /
                    `INVALID_PLAN` / `REALM_MISMATCH` / `FORBIDDEN_TENANT` / `NOT_FOUND` /
                    `ALREADY_SYNCING` / `RESERVATION_EXISTS` / `EXECUTION_FAILED` /
                    `USAGE_UNAVAILABLE` を返します。
                    上記は代表的なもので網羅ではありません。下流サービスの障害時には
                    `SF_AUTH_ERROR` / `SF_API_ERROR` / `INTERNAL_ERROR` / `UNKNOWN_ERROR` なども返ります
                message:
                  type: string
                  description: |
                    エラーの詳細。同じ `errorCode` でも条件により内容が異なります
                    （例: 解約済み SIM への予約は `BAD_REQUEST` + `SIM is terminated`）
                errors:
                  type: array
                  items:
                    type: object
                  description: |
                    リクエストボディの形式が不正な場合（必須キーの欠落・型不正）のみ、`message` の代わりに
                    不正箇所の配列が入ります（`errorCode` は `VALIDATION_ERROR`）。
                    値が空文字の場合など、同じ `VALIDATION_ERROR` でも `message` で返る場合があります

  responses:
    BadRequest:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 認可情報が伴わないリクエスト
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        認証スコープ外の要求、または指定リソースへのアクセス権限がない。
        `customer_code` に認証情報と異なる顧客コードを指定した場合、認証情報に顧客スコープが無い場合、
        または指定 SIM を当該顧客が所有していない場合。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: リソースが見つからない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: 上流サービスエラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
