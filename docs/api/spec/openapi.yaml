  /recharges/sims/{sim_id}/plans:
    get:
      tags: [Recharges]
      summary: SIM 別リチャージプラン
      description: 特定 SIM の現在のプランに基づいて、利用可能なリチャージプランを取得します。
      operationId: ListSimRechargePlans
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM ID（ICCID）
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
              example:
                plans:
                  - plan_code: "OI061331"
                    plan_type: capacity
                    capacity_limit: 10.0
                    daily_limit: null
                    duration_days: 30
                total_count: 2
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /recharges/sims/{sim_id}/balance:
    get:
      tags: [Recharges]
      summary: SIM 残量取得
      description: |
        SIM の残容量情報を取得します（プランタイプに応じた 3 値を返す）。

        累積 usage の取得に失敗した場合は `503` を返し、古い残量値は返しません（stale データを防ぐ）。
      operationId: GetSimBalance
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子（ICCID）
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeSimBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: 累積 usage の取得に失敗（古い値は返さない）

  /recharges/plans:
    get:
      tags: [Recharges]
      summary: 全リチャージプラン一覧
      description: 顧客が利用可能な全リチャージプランのカタログを取得します。
      operationId: ListRechargePlans
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
              example:
                plans:
                  - plan_code: "OI061331"
                    plan_type: capacity
                    capacity_limit: 10.0
                    daily_limit: null
                    duration_days: 30
                  - plan_code: "OI061340"
                    plan_type: daily
                    capacity_limit: null
                    daily_limit: 3.0
                    duration_days: 90
                total_count: 3
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /recharges/plans/{plan_code}:
    get:
      tags: [Recharges]
      summary: プラン詳細
      description: 特定のリチャージプランの詳細情報を取得します。
      operationId: GetRechargePlan
      parameters:
        - name: plan_code
          in: path
          required: true
          description: プラン識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                plan_code: "OI061331"
                plan_type: capacity
                capacity_limit: 10.0
                daily_limit: null
                duration_days: 30
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /recharges/reservations:
    get:
      tags: [Recharges]
      summary: リチャージ予約一覧
      description: 顧客のリチャージ予約一覧を取得します。ICCID / SIM ID やステータスでのフィルタリングが可能です。
      operationId: ListRechargeReservations
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - $ref: "#/components/parameters/IccidQuery"
        - $ref: "#/components/parameters/SimIdQuery"
        - name: status
          in: query
          description: ステータスでフィルタ
          schema:
            type: string
            enum: [reserved, executed, failed]
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationsResponse"
              example:
                reservations:
                  - reservation_id: "RR-00012"
                    iccid: "8981080321000912770"
                    plan_code: "OI061331"
                    status: Executed
                    reserved_at: "2026-03-10T10:30:00Z"
                    executed_at: "2026-03-10T10:30:02Z"
                total_count: 1
                page_size: 200
                has_more: false
                next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
    post:
      tags: [Recharges]
      summary: リチャージ予約作成
      description: |
        SIM に対するリチャージ予約を作成します。1つの SIM に対して最大3件の予約が可能です。

        **実行タイミング**:
        - **容量型 (capacity)**: 現在の残量が 500MB 未満、もしくは容量プラン終了日を過ぎた 21:00 JST に自動実行される。
        - **日次型 (daily)**: 毎日 20:00 JST に当日分の枠が自動実行される。
        - 500MB 以下の小容量プランは残量閾値を待たずに前倒し実行される場合がある。

        `status` は生成時に `reserved` で、上記のタイミングに到達すると `executed` に遷移する。
      operationId: CreateRechargeReservation
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
            example:
              sim_id: "8981080321000912770"
              plan_code: "OI061331"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              example:
                reservation_id: "RR-00012"
                status: 予約済み
                reserved_at: "2026-03-10T10:30:00Z"
                executed_at: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /recharges/immediate:
    post:
      tags: [Recharges]
      summary: 即時リチャージ（プラン即時書換・残量リセット）
      description: |
        ICCID とプランコードを指定して、**即時にプラン書換・残量リセット・PCRF 1 回 sync** を実行します。
        容量型プランのみ対象（日次型・CPFR・Internal はエラー）。予約の作成と実行をその場で行い、
        予約は即 `Executed` 化されます。

        `force=true` で既存 `Reserved` 予約を `Cancelled` 化して前倒し実行します。
        PCRF 同期中（`SyncStatus=実行中`）は force 不問で `409 ALREADY_SYNCING`。
      operationId: CreateImmediateRecharge
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImmediateRechargeRequest"
            example:
              sim_id: "8981080301011327143"
              plan_code: "OI071522"
              force: false
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmediateRechargeResponse"
              example:
                iccid: "8981080301011327143"
                plan_code: "OI071522"
                status: Executed
                reservation_id: "a1XRB000005P7Q12AK"
                sync_status: 実行中
                superseded_reservation_ids: []
                error_code: null
                message: "Immediate recharge executed. PCRF sync triggered."
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 指定 SIM に対するリチャージ権限がありません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 進行中予約あり、もしくは PCRF 同期中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          description: 累積 usage 取得失敗（DML 前に中断）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key

  parameters:
    CustomerCode:
      name: customer_code
      in: query
      description: |
        9桁の顧客コード。省略時は認証情報に紐づく顧客コードを使用します。
        指定する場合は認証情報のスコープと一致している必要があり、不一致の場合は 403 を返します。
      schema:
        type: string
        pattern: '^\d{9}$'
        example: "110139701"
    PageSize:
      name: page_size
      in: query
      description: 1ページあたりの件数
      schema:
        type: integer
        default: 200
    Cursor:
      name: cursor
      in: query
      description: ページネーションカーソル
      schema:
        type: string
    IccidQuery:
      name: iccid
      in: query
      deprecated: true
      description: SIM の ICCID でフィルタ。`sim_id` と併用された場合は `iccid` を優先
      schema:
        type: string
    SimIdQuery:
      name: sim_id
      in: query
      description: SIM ID (ICCID のエイリアス) でフィルタ
      schema:
        type: string
    SimIdPrefixFilter:
      name: sim_id
      in: query
      description: |
        SIM 識別子（`sim_id`）の**前方一致**で絞り込みます（#76）。

        - **英数字**・32 文字以内。条件を満たさない値（記号を含むもの）・空文字は **400**
        - **小文字は大文字として扱います**（`ab123` と `AB123` は同じ結果）。
          格納値が英大文字と数字のみのためです
        - ⚠️ **`sim_id` は ICCID とは限りません。** 19 桁の数字（ICCID）と、
          英大文字 2 文字 + 数字 13 桁の 15 桁の識別子が混在し、後者が約 37% を
          占めます（2026-08-21 本番実測）。前方一致の桁数を ICCID 前提で
          決め打ちしないでください
        - 他の絞り込み条件とは **AND** で結合します

        ⚠️ **`/v1/recharges/sims` の `sim_id` とは一致方式が違います。**
        あちらは**完全一致**（`recharges/lambda_function.py` のクライアント側フィルタ）で、
        こちらは前方一致です。同じパラメータ名なので取り違えに注意してください。
      schema:
        type: string
        pattern: '^[0-9A-Za-z]+$'
        maxLength: 32
        example: "8981080"
    MsisdnPrefixFilter:
      name: msisdn
      in: query
      description: |
        電話番号（MSISDN）の**前方一致**で絞り込みます（#76）。

        処理は次の順序で行います（`pattern` は入力の形を緩く示したものなので、
        受理されるかどうかはこの順序が決めます）:

        1. **区切り文字（ハイフン `-`・半角/全角スペース・括弧 `(` `)`）を除去**します
           （`070-1234-5678` と `07012345678` は同じ結果）
        2. **国番号に変換**します。先頭の `+` は落とし（`%2B8140` → `8140`）、
           先頭が `00` ならそれを落とし（`00819012` → `819012`）、
           先頭が `0` なら `81` に置き換えます（`07012` → `817012`）。
           `mc_sims.msisdn` が国番号付き（`8140...`）で格納されているためです
        3. **変換後の値**を検証します。数字のみ・空でない・**32 文字以内**であること。
           満たさない場合は **400**（全角数字・記号を含む値、`---` のように除去すると
           空になる入力、変換後に 32 文字を超えるものが該当）

        先頭の `+` は、生の `+` でもパーセントエンコード（`%2B`）でも同じ結果になります
        （前者は空白としてデコードされたうえで、1. の区切り文字として除去されるため）。
      schema:
        # 区切り文字を含む入力も受け付ける。数字のみ・32 文字以内の判定は
        # 区切り文字を除いた後の値に対して行われるため、maxLength は置かない。
        type: string
        pattern: '^\+?[0-9()\- 　]+$'
        example: "070-1234-5678"

  schemas:
    # ----- SIM -----
    Sim:
      type: object
      description: |
        `GET /v1/sims` の応答。`mc_sims` ビューの 37 列に対応する。
        明細 `GET /v1/sims/{sim_id}` は、これに `note` を足した `SimDetail` を返す。

        `filter_nulls=true`（既定）のとき、値が null のフィールドは **キーごと応答から消える**
        （`null` として返るのではない）。`nullable: true` が効くのは `filter_nulls=false` のとき。
      properties:
        sim_id:
          type: string
          description: |
            SIM 識別子（`sf.inventory.Name`）。**ICCID とは限りません。**
            19 桁の数字（ICCID）と、英大文字 2 文字 + 数字 13 桁の 15 桁の識別子が
            混在し、後者が約 37% を占めます（2026-08-21 本番実測）。
        customer_code:
          type: string
          description: 顧客コード（9桁）
        application_start_date:
          type: string
          format: date
          nullable: true
          description: 申込開始日
        cancellation_mobile_core_date:
          type: string
          format: date
          nullable: true
          description: モバイルコア解約日
        carrier_opening_date:
          type: string
          format: date
          nullable: true
          description: キャリア開通日
        carrier_withdrawal_date:
          type: string
          format: date
          nullable: true
          description: キャリア脱退日
        communication_generation:
          type: string
          nullable: true
          description: 通信世代（4G/5G 等）
        dns_primary:
          type: string
          nullable: true
          description: プライマリ DNS
        dns_secondary:
          type: string
          nullable: true
          description: セカンダリ DNS
        extension_end_date:
          type: string
          format: date
          nullable: true
          description: 延長終了日
        first_communicating_date:
          type: string
          format: date
          nullable: true
          description: 初回通信日
        imsi:
          type: string
          description: IMSI。実データでは 38% が空文字
        ip_address:
          type: string
          nullable: true
          description: IP アドレス
        ip_address_type:
          type: string
          nullable: true
          description: IP アドレス種別
        ipv6_address_dns_primary:
          type: string
          description: IPv6 プライマリ DNS。実データでは 100% が空文字
        ipv6_address_dns_secondary:
          type: string
          description: IPv6 セカンダリ DNS。実データでは 100% が空文字
        ipv6_address:
          type: string
          description: IPv6 アドレス。実データでは 100% が空文字
        line_category:
          type: string
          nullable: true
          description: 回線種別
        line_status_from_mc:
          type: string
          nullable: true
          description: MC 側の回線状態
        line_stoped_date:
          type: string
          format: date
          nullable: true
          description: 回線停止日
        lines_status:
          type: string
          nullable: true
          description: 回線状態
        linestarted_date:
          type: string
          format: date
          nullable: true
          description: 回線開始日
        opening_date:
          type: string
          format: date
          nullable: true
          description: 開通日
        msisdn:
          type: string
          description: 電話番号。実データでは 11% が空文字
        realm:
          type: string
          nullable: true
          description: レルム
        service_category:
          type: string
          nullable: true
          description: サービス種別
        use_start_expiration_date:
          type: string
          format: date
          nullable: true
          description: 利用開始期限
        shipping_date:
          type: string
          format: date
          nullable: true
          description: 出荷日
        apn:
          type: string
          description: APN。実データでは 24% が空文字
        active_plan_name:
          type: string
          description: 現在適用中のプラン名（商談商品名）。`plan_detail` に相当する。実データでは 15% が空文字
        product_name:
          type: string
          description: 商品名。実データ上 `active_plan_name` と同値。実データでは 15% が空文字
        sim_category:
          type: string
          nullable: true
          description: SIM 種別
        product_name_id:
          type: string
          description: 商品名 ID。名称に反して ID ではなく、`product_name` とは別の商品名が入る。実データでは 15% が空文字
        status:
          type: string
          enum: [stock, ready, active, inactive, terminated, unknown]
          description: |
            回線状態。Salesforce の状態フィールドから CASE 式で導出され、上から順に評価されます
            （`stock` → `ready` → `active` → `inactive` → `terminated` → `unknown`）。

            **`SimSummary` との対応**: `ready` / `active` / `terminated` / `unknown` は共通ですが、
            `stock` と `inactive` はサマリに出力されません。逆にサマリの `subscribed` は
            `status <> 'terminated'` の集計値で、この enum には対応する値がありません（#16）。

            ⚠️ **`active` の件数を稼働回線数として扱わないでください。** 評価順の都合で
            `ready` の条件が先に当たるため、実際に稼働している回線の大半が `ready` に分類されます
            （本番実測: `active` は 200 万行中 42 行、うち 17 行は Salesforce 側で解約済み）。
            この判定ロジックの見直しは #28 で扱います。
        session_status:
          type: string
          enum: [online, offline]
          description: セッション接続状態。開始済みかつ未終了の CDR がある場合に `online`
        session_created_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-18T22:54:11Z"
          description: |
            最新セッションの開始時刻（UTC・秒精度）。セッション履歴が無い場合は `null`。
        session_terminated_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-18T22:54:11Z"
          description: |
            最新セッションの終了時刻（UTC・秒精度）。セッションが継続中、または
            セッション履歴が無い場合は `null`。

    SimDetail:
      description: |
        `GET /v1/sims/{sim_id}` の応答。`Sim` の全フィールドに加えて `note` を返す。

        `note` は明細でのみ返る。`GET /v1/sims`（一覧）と CSV エクスポートには
        含まれない（#57）。
      allOf:
        - $ref: "#/components/schemas/Sim"
        - type: object
          properties:
            note:
              type: string
              nullable: true
              maxLength: 255
              example: "不良SIMのため交換対応済み"
              description: |
                備考。単一の上書き型メモで、履歴・作成者・更新時刻は持たない。

                備考が無い SIM では `filter_nulls=true`（既定）なら **キーごと落ち**、
                `filter_nulls=false` なら `null` が返る。どちらも「備考なし」を意味し、
                クライアントは両者を区別しない。**空文字は返らない**（空は `null` に寄せる）。

    SimCount:
      type: object
      description: |
        `GET /v1/sims` と同じ絞り込みに一致する `mc_sims` ビューの行数。
        SIM の枚数ではありません。
      required: [count]
      properties:
        count:
          type: integer
          description: 一致した行数

    SimSummary:
      type: object
      description: |
        顧客に紐づく SIM のステータス別集計。各件数は `mc_sims` の行数を数えたもの。
      properties:
        customer_code:
          type: string
          description: 顧客コード
        total:
          type: integer
          description: 全件
        subscribed:
          type: integer
          description: 解約以外（在庫・停止を含む）
        ready:
          type: integer
          description: 開通済みで出荷済み
        active:
          type: integer
          description: 稼働中
        online:
          type: integer
          description: セッション接続中
        terminated:
          type: integer
          description: 解約済み
        unknown:
          type: integer
          description: 上記のいずれにも該当しない
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: |
            集計元データ（`sf.inventory`）の最終更新時刻。当該顧客のレコードのうち
            Salesforce 上で最後に更新されたものの時刻を返す（同期パイプラインの実行時刻ではない）。
            対象レコードが無い場合は null。

    # ----- Statistics -----
    MonthlyUsage:
      type: object
      properties:
        year_month:
          type: string
          description: "YYYYMM 6 桁ゼロ埋め"
          example: "202603"
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer

    SimMonthlyUsage:
      allOf:
        - type: object
          properties:
            sim_id:
              type: string
            customer_code:
              type: string
            last_updated_at:
              type: string
              format: date-time
              nullable: true
              example: "2026-08-31T14:48:12Z"
              description: |
                集計元レコード（Salesforce の使用実績）の最終更新時刻（UTC・秒精度）。
                同期パイプラインの実行時刻ではありません。
            reissue_category:
              type: string
              nullable: true
              enum: ["new", "old", "total", null]
              description: |
                SIM 再発行が発生した月のみ値が入る。通常月は `null`。
                - `new`: 再発行後の通信量
                - `old`: 再発行前の通信量（旧 Inventory 配下）
                - `total`: 旧 + 新 の合算行
        - $ref: "#/components/schemas/MonthlyUsage"

    MonthlyUsageBySim:
      type: object
      properties:
        sim_id:
          type: string
          nullable: true
          description: "view は LEFT JOIN のため、参照先の sf.inventory 行が無い場合は null になりうる。"
        year_month:
          type: string
          description: "YYYYMM 6 桁ゼロ埋め"
          example: "202608"
        msisdn:
          type: string
          nullable: true
          description: "sf.inventory.MSISDN__c は NULL 可 (dev 実測 7%)。"
        plan_name:
          type: string
          nullable: true
          description: "sf.use_achievement.PlanName__c は view の WHERE で絞っていないため NULL 可。"
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer
        total_bytes:
          type: integer
          description: "サーバ側で `downlink_bytes + uplink_bytes` を計算した値。片方 NULL の場合はもう一方の値。"
        reissue_category:
          type: string
          nullable: true
          enum: ["new", "old", "total", null]
          description: |
            SIM 再発行が起きた月に Salesforce が作る 3 行の種別。通常行は `null`。
            - `new`: 再発行後の通信量
            - `old`: 再発行前の通信量（旧 Inventory 配下）
            - `total`: 旧 + 新 の合算行（新 Inventory と同じ `(sim_id, year_month)` に載る）

    SimDailyUsage:
      type: object
      properties:
        sim_id:
          type: string
          description: SIM 識別子 (ICCID)
        msisdn:
          type: string
        customer_code:
          type: string
        date:
          type: string
          format: date
          description: 対象日 (JST カレンダー日)
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer
        total_bytes:
          type: integer
        is_confirmed:
          type: boolean
          description: |
            該当日の値の確定度。`true` = 日次集計（1DAY）で確定済み。
            `false` = 未確定で、`date` が「`checked_at` を JST に変換した日付」の前日以降なら
            5 分粒度集計（5MINS）由来の速報値、それより古い日は補完対象外のため値が不明
            （`0` を「通信なし」として扱わないこと）。
            `date` は JST の日付、`checked_at` は UTC 表記なので、比較の前に TZ を揃えること。
            詳細はエンドポイントの description を参照。
        checked_at:
          type: string
          format: date-time
          description: |
            集計を実行した時刻。**UTC 表記（`YYYY-MM-DDTHH:MM:SSZ`）** で返ります。

            `date` は JST の日付なので、両者を比較する場合は `checked_at` を
            JST（UTC + 9 時間）に変換してください。
        data_through:
          type: string
          format: date
          description: 日次集計が確定している最終日

    SimDailyUsageExport:
      type: object
      description: |
        `GET /v1/stats/sims/{sim_id}/daily_usage/export` の応答。CSV 本体は
        `download_url` からダウンロードします。
      required:
        - file_name
        - row_count
        - download_url
        - expires_in_seconds
        - data_through
      properties:
        file_name:
          type: string
          description: S3 に配置したファイル名。
        row_count:
          type: integer
          minimum: 0
          description: CSV のデータ行数 (ヘッダ行を除く)。0 のときはヘッダのみ。
        download_url:
          type: string
          format: uri
          description: プリサインド URL (S3 GetObject)。
        expires_in_seconds:
          type: integer
          description: プリサインド URL の有効秒数。
        data_through:
          type: string
          format: date
          nullable: true
          description: |
            日次集計が確定している最終日。全行同値のため CSV 列でなく本フィールドに 1 度だけ含めます。
            **0 件のときは `null`**（集計状態を返す情報源が無いため）。

    CdrRecord:
      type: object
      properties:
        sim_id:
          type: string
        customer_code:
          type: string
        record_begins_at:
          type: string
          format: date-time
        session_created_at:
          type: string
          format: date-time
          nullable: true
        session_deleted_at:
          type: string
          format: date-time
          nullable: true
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer

    CumulativeUsage:
      allOf:
        - $ref: "#/components/schemas/CustomerCumulativeUsage"
      description: |
        `GET /v1/stats/sims/{sim_id}/cumulative_usage` の 1 要素。
        フィールド構成は `CustomerCumulativeUsage` と同一。

    CustomerCumulativeUsage:
      type: object
      properties:
        sim_id:
          type: string
          description: SIM 識別子 (ICCID)
        customer_code:
          type: string
        msisdn:
          type: string
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer
        total_bytes:
          type: integer
          description: 生涯通算の通信量（`downlink_bytes` + `uplink_bytes`）
        checked_at:
          type: string
          format: date-time
          example: "2026-08-14T06:45:49Z"
          description: この値を算出した時刻（UTC・秒精度）
        latest_record_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-14T06:40:00Z"
          description: 集計に含まれた最新の通信記録の時刻（UTC・秒精度）

    CurrentPlanUsage:
      type: object
      properties:
        sim_id:
          type: string
          description: SIM 識別子 (ICCID)
        customer_code:
          type: string
        msisdn:
          type: string
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer
        total_bytes:
          type: integer
          description: 累積通信量
        checked_at:
          type: string
          format: date-time
          example: "2026-08-14T06:45:49Z"
          description: この値を算出した時刻（UTC・秒精度）
        latest_record_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-14T06:40:00Z"
          description: 集計に含まれた最新の通信記録の時刻（UTC・秒精度）
        plan_code:
          type: string
          nullable: true
          description: 最新の Executed リチャージ予約のプランコード
        plan_started_at:
          type: string
          format: date-time
          nullable: true
          description: 現プラン開始時刻 (最新 Executed リチャージ予約の実行日時)
        usage_offset_bytes:
          type: integer
          nullable: true
          description: プラン適用時点の累積通信量
        current_plan_used_bytes:
          type: integer
          nullable: true
          description: 現プランでの消費量 = total_bytes − usage_offset_bytes (offset 不明時は null)

    # ----- Exports -----
    ExportAsync:
      type: object
      properties:
        file_name:
          type: string
        download_url:
          type: string
        message:
          type: string
        expires_in_seconds:
          type: integer

    ExportSync:
      type: object
      properties:
        file_name:
          type: string
        row_count:
          type: integer
        file_size_bytes:
          type: integer
        s3_url:
          type: string
        download_url:
          type: string

    # ----- Recharges -----
    RechargeSim:
      type: object
      properties:
        iccid:
          type: string
        product_code:
          type: string
        plan_type:
          type: string
          enum: [capacity, daily]
        extension_end_date:
          type: string
          format: date
        reservation_count:
          type: integer
        recharge_available:
          type: boolean
        usage_offset_bytes:
          type: integer
          description: |
            現プランの容量計算の起点バイト数（直近実行済み予約の通算転送容量オフセット）。
            `現プラン使用量 = 通算転送容量 − usage_offset_bytes` で算出。未リチャージ時は 0。

    RechargeSimsResponse:
      type: object
      properties:
        sims:
          type: array
          items:
            $ref: "#/components/schemas/RechargeSim"
        total_count:
          type: integer
        page_size:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true

    RechargeSimBalance:
      type: object
      description: |
        SIM の残量情報。プランタイプ (`capacity` / `daily`) に応じた 3 値
        （付与済み・使用済み・残量）を返す。`filler_state` は残量が閾値を下回った
        ときの前倒し実行状態を示す。
      properties:
        sim_id:
          type: string
          description: SIM 識別子（ICCID）
        plan_type:
          type: string
          enum: [capacity, daily]
          description: 現在適用中のプラン種別
        total_granted_bytes:
          type: integer
          description: 付与済み容量（バイト）
        total_remaining_bytes:
          type: integer
          description: 残量（バイト）
        used_bytes:
          type: integer
          description: 使用済み容量（バイト）
        banked_data_bytes:
          type: integer
          nullable: true
          description: 繰越データ（バイト、対応プランのみ）
        filler_state:
          type: string
          enum: [NORMAL, FILLER_LARGE, FILLER_SMALL]
          description: |
            残量閾値による前倒し実行状態。`NORMAL` は通常、
            `FILLER_LARGE` / `FILLER_SMALL` は前倒し実行が発火する状態。

    Plan:
      type: object
      properties:
        plan_code:
          type: string
        plan_type:
          type: string
          enum: [capacity, daily]
        capacity_limit:
          type: number
          nullable: true
          description: GB 上限（capacity プランのみ）
        daily_limit:
          type: number
          nullable: true
          description: 日次 GB 上限（daily プランのみ）
        duration_days:
          type: integer
        plan_detail:
          type: string
          nullable: true
          description: プラン詳細（商談商品名）

    PlansResponse:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
        total_count:
          type: integer

    CreateReservationRequest:
      type: object
      required: [plan_code]
      description: |
        `iccid` または `sim_id` のいずれか必須。両指定 + 異なる値、または両欠落は 400 を返します。両指定 + 同値は許容。
      properties:
        iccid:
          type: string
          deprecated: true
          description: 対象 SIM の ICCID
        sim_id:
          type: string
          description: SIM ID（ICCID のエイリアス）
        plan_code:
          type: string
          description: リチャージプランコード

    Reservation:
      type: object
      properties:
        reservation_id:
          type: string
        status:
          type: string
        reserved_at:
          type: string
          format: date-time
        executed_at:
          type: string
          format: date-time
          nullable: true
          description: 実行日時（未実行時 null）

    ReservationDetail:
      allOf:
        - $ref: "#/components/schemas/Reservation"
        - type: object
          properties:
            iccid:
              type: string
            plan_code:
              type: string

    ImmediateRechargeRequest:
      type: object
      required: [plan_code]
      description: |
        `iccid` または `sim_id` のいずれか必須。両指定 + 異なる値、または両欠落は 400 を返します。両指定 + 同値は許容。
      properties:
        iccid:
          type: string
          deprecated: true
          description: 対象 SIM の ICCID（19-20 桁）
        sim_id:
          type: string
          description: SIM ID（ICCID のエイリアス）
        plan_code:
          type: string
          description: 書き換え先プランコード（容量型のみ）
        force:
          type: boolean
          default: false
          description: |
            `true` のとき既存 `Reserved` 予約を Cancelled 化して前倒し実行する。
            既定 `false` の場合は進行中予約があると `409 RESERVATION_EXISTS`。

    ImmediateRechargeResponse:
      type: object
      description: |
        即時リチャージ結果。成功時は `status='Executed'` で `reservation_id` 等が埋まる。
      properties:
        iccid:
          type: string
        plan_code:
          type: string
        status:
          type: string
          nullable: true
          description: 予約ステータス（成功時 `Executed`）
        reservation_id:
          type: string
          nullable: true
          description: 生成された予約レコード ID
        sync_status:
          type: string
          nullable: true
          description: Inventory の同期ステータス（成功時 `実行中` → 下流で `実行済`）
        superseded_reservation_ids:
          type: array
          items:
            type: string
          description: force で Cancelled 化した既存 Reserved 予約 ID
        error_code:
          type: string
          nullable: true
        message:
          type: string

    ReservationsResponse:
      type: object
      properties:
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/ReservationDetail"
        total_count:
          type: integer
        page_size:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true

    # ----- Common -----
    Error:
      type: object
      properties:
        detail:
          oneOf:
            - type: string
            - type: object
              properties:
                errorCode:
                  type: string
                message:
                  type: string

  responses:
    BadRequest:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 認可情報が伴わないリクエスト
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        認証スコープ外の要求。
        `customer_code` に認証情報と異なる顧客コードを指定した場合、または認証情報に顧客スコープが無い場合。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: リソースが見つからない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: 上流サービスエラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
