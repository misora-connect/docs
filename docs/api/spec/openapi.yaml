            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===== Exports =====
  /exports:
    get:
      tags: [Exports]
      summary: ListExports — エクスポート種別一覧
      description: 利用可能なエクスポート種別の一覧を取得します。
      operationId: ListExports
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  exports:
                    type: array
                    items:
                      type: string
              example:
                exports: ["sims", "monthly_usage_by_sim"]

  /exports/sims:
    post:
      tags: [Exports]
      summary: CreateSimsExport — SIM データエクスポート
      description: |
        SIM データのエクスポートをリクエストします。

        - **非同期モード**（デフォルト）: 即座に署名付きダウンロード URL を返却し、バックグラウンドで処理を実行します。
        - **同期モード**: 処理完了まで待機します。

        解約済み SIM は除外されます。

        CSV は以下の **42 列** を、この順で出力します（列名は `Sim` スキーマのフィールド名）。

        `sim_id`, `customer_code`, `application_start_date`, `cancellation_mobile_core_date`,
        `carrier_opening_date`, `carrier_withdrawal_date`, `communication_generation`,
        `dns_primary`, `dns_secondary`, `extension_end_date`, `first_communicating_date`,
        `imsi`, `ip_address`, `ip_address_type`, `line_category`, `line_status_from_mc`,
        `line_stoped_date`, `lines_status`, `linestarted_date`, `opening_date`,
        `puk1`, `user_id`, `password`, `msisdn`, `realm`,
        `service_category`, `use_start_expiration_date`, `shipping_date`, `apn`,
        `active_plan_name`, `product_name`, `sim_category`, `product_name_id`,
        `status`, `session_status`, `session_created_at`, `session_terminated_at`,
        `lines_state_ss_for_mypage`, `product_code`, `quotation_application_number`, `tel`,
        `sim_stock_status`

        `Sim` スキーマのうち `ipv6_address` / `ipv6_address_dns_primary` /
        `ipv6_address_dns_secondary` の 3 列は **CSV には出力しません**（実データで常に空のため）。
        `GET /v1/sims` の応答には引き続き含まれます。

        ⚠️ **2026-09 の更新で列構成が変わりました**（37 列 → 41 列）。
        - ipv6 系 3 列を削除（旧 CSV の 15〜17 列目）。**それより後ろの列は位置が 3 つ前にずれます**
        - `puk1` / `password` を `opening_date` の直後に追加。
          **それより後ろの列は位置が 2 つ後ろにずれます**（ipv6 の削除と合わせると正味 1 つ前）
        - `lines_state_ss_for_mypage` 以降の 5 列を末尾に追加

        続く更新で `user_id`（APN 認証のユーザ ID）を `password` の直前に追加しました（41 列 → 42 列）。
        `password` と組で使う値のため、例外的に途中に置いています。
        **`password` 以降の列は位置が 1 つ後ろにずれます。**

        列名で読んでいる場合は、削除した 3 列を参照していなければ影響ありません。
        列を位置で読んでいる場合は追随してください。今後列を足す場合は原則として末尾に足します。

        ### `header_lang=ja` の列名

        `header_lang=ja` を指定すると、ヘッダー行だけが以下の日本語の列名になります
        （列の数・並び・値は既定の `en` と同じです）。

        | 列 | 日本語の列名 |
        | --- | --- |
        | `sim_id` | 製造番号/ICCID |
        | `customer_code` | 顧客コード |
        | `application_start_date` | 適用開始日 |
        | `cancellation_mobile_core_date` | モバイルコア解約日 |
        | `carrier_opening_date` | キャリア開通日 |
        | `carrier_withdrawal_date` | 解約日 |
        | `communication_generation` | 通信規格 |
        | `dns_primary` | DNSプライマリ |
        | `dns_secondary` | DNSセカンダリ |
        | `extension_end_date` | 有効期限日 |
        | `first_communicating_date` | 初回通信日 |
        | `imsi` | IMSI |
        | `ip_address` | IPアドレス |
        | `ip_address_type` | IPアドレスタイプ |
        | `line_category` | 回線種別 |
        | `line_status_from_mc` | 回線状態（モバイルコア） |
        | `line_stoped_date` | 回線停止日 |
        | `lines_status` | 回線状態（在庫管理） |
        | `linestarted_date` | 回線再開日 |
        | `opening_date` | モバイルコア開通日 |
        | `puk1` | PUK1 |
        | `user_id` | ユーザID |
        | `password` | パスワード |
        | `msisdn` | 電話番号（国際表記） |
        | `realm` | レルム |
        | `service_category` | サービス種別 |
        | `use_start_expiration_date` | 利用開始期限日 |
        | `shipping_date` | 出荷日 |
        | `apn` | APN |
        | `active_plan_name` | プラン名 |
        | `product_name` | 商品名 |
        | `sim_category` | SIMサイズ |
        | `product_name_id` | 商品マスタ |
        | `status` | 回線状態 |
        | `session_status` | セッション状態 |
        | `session_created_at` | セッション開始日時 |
        | `session_terminated_at` | セッション終了日時 |
        | `lines_state_ss_for_mypage` | 回線状態（マイページ） |
        | `product_code` | 商品コード |
        | `quotation_application_number` | 見積・申込番号 |
        | `tel` | 電話番号 |
        | `sim_stock_status` | SIM状態 |
      operationId: CreateSimsExport
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - name: format
          in: query
          description: 出力形式
          schema:
            type: string
            default: csv
            enum: [csv, json, jsonl]
        - $ref: "#/components/parameters/HeaderLang"
        - name: async
          in: query
          description: "`true`: 非同期処理（即時レスポンス）、`false`: 同期処理（完了待ち）"
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExportAsync"
                  - $ref: "#/components/schemas/ExportSync"
              examples:
                async:
                  summary: 非同期レスポンス
                  value:
