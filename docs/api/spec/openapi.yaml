  /exports/monthly_usage_by_sim:
    post:
      tags: [Exports]
      summary: CreateMonthlyUsageBySimExport — 月次利用実績 CSV エクスポート (SIM 別)
      description: |
        指定月の SIM 別月次利用実績を CSV でエクスポートします。misora-central の
        US-027（月次利用実績 CSV 出力）が消費する EP です。

        - **非同期モード**（デフォルト）: 即座に署名付きダウンロード URL を返却し、バックグラウンドで処理します。
        - **同期モード**: 処理完了まで待機します。

        CSV は 8 列固定で以下の順に出力されます。ヘッダーは既定（`header_lang=en`）で英字、
        `header_lang=ja` で日本語の列名になります（値は同じです）。

        | 列 | `header_lang=ja` の列名 | 型 | 内容 |
        | --- | --- | --- | --- |
        | `year_month` | 年月 | string | `YYYYMM` |
        | `sim_id` | 製造番号/ICCID | string | 既存 SIM EP と同じ ID（ICCID とは限らない） |
        | `msisdn` | 電話番号（国際表記） | string | 電話番号（国際表記。例 `814011001010`） |
        | `tel` | 電話番号 | string | 電話番号（国内表記。例 `04011001010`）。値が無い場合は空欄（本番実測で 12.4%） |
        | `reissue_category` | 再発行区分 | string | 再発行区分。`new`（新 SIM）/ `old`（旧 SIM）/ `total`（合計行）。再発行の無い通常行は空 |
        | `uplink_bytes` | 上り（バイト） | integer | 上り通信量（生バイト、0 埋め） |
        | `downlink_bytes` | 下り（バイト） | integer | 下り通信量（生バイト、0 埋め） |
        | `total_bytes` | 合計（バイト） | integer | `uplink_bytes + downlink_bytes`（サーバ側計算） |

        - 実績 0 件は 200 + ヘッダのみの CSV を返します（「その月に実績が無い」は正常な結果）。
        - 再発行月は「旧 SIM / 新 SIM / 合計」の 3 行が並びます。`exclude_total=true` を渡すと Salesforce が入れる合計行（`reissue_category='total'`）を除外できます。
      operationId: CreateMonthlyUsageBySimExport
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - name: year_month
          in: query
          required: true
          description: 対象月 `YYYYMM`（6 桁）
          schema:
            type: string
            pattern: '^\d{6}$'
          example: "202608"
        - name: exclude_total
          in: query
          description: |
            Salesforce が再発行月に入れる合計行（`reissue_category='total'`）を除外します。
            旧 SIM 行と新 SIM 行はそのまま残ります。既定 `false`。
          schema:
            type: boolean
            default: false
        - name: format
          in: query
          description: 出力形式（CSV のみ）
          schema:
            type: string
            default: csv
            enum: [csv]
        - $ref: "#/components/parameters/HeaderLang"
        - name: async
          in: query
          description: "`true`: 非同期処理（即時レスポンス）、`false`: 同期処理（完了待ち）"
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExportAsync"
                  - $ref: "#/components/schemas/ExportSync"
              examples:
                async:
                  summary: 非同期レスポンス
                  value:
                    file_name: "monthly_usage_by_sim_110139801_202608_01KABHF5NQGE8S4AT877421K6J.csv"
                    download_url: "https://mc-prod-exports.s3.amazonaws.com/..."
                    message: "Export is being processed. The file will be available shortly at the download URL."
                    expires_in_seconds: 86400
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

