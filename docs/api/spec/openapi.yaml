openapi: 3.0.3
info:
  title: Misora Connect API
  description: |
    SIM の管理、通信量の統計、データエクスポート、リチャージなどの機能を提供する REST API です。

    ## Authentication
    全てのリクエストに `x-api-key` ヘッダが必要です。

    ## Customer Code
    顧客スコープは認証情報（API Key / トークン）から決まります。`customer_code`（9桁数字）は省略可能で、省略時は認証情報に紐づく顧客コードが自動的に使用されます。

    明示的に指定する場合は、認証情報のスコープと一致している必要があります。異なる顧客コードを指定したリクエストは `403` で拒否されます（指定が無視されて別のデータが返ることはありません）。

    ## レスポンス形式
    全て JSON 形式で返却されます。日時は ISO 8601 形式（`YYYY-MM-DDTHH:MM:SSZ`）です。
  version: "1.0"

servers:
  - url: https://api.misora-connect.com/v1
    description: Production

security:
  - ApiKeyAuth: []

tags:
  - name: SIM Management
    description: SIM の一覧取得、詳細情報の参照、サマリー統計の取得
  - name: Statistics
    description: SIM の通信量統計・CDR（通信明細）・累積使用量
  - name: Exports
    description: SIM データの CSV/JSON/JSONL エクスポート
  - name: Recharges
    description: SIM プランのリチャージ（容量追加）管理

paths:
  # ===== SIM Management =====
  /sims:
    get:
      tags: [SIM Management]
      summary: SIM 一覧取得
      description: |
        顧客に紐づく SIM のページネーション付き一覧を取得します。

        **母集団**: 既定（`include_terminated=false`）では `status <> 'terminated'` が対象です。
        在庫（`stock`）・停止（`inactive`）も含まれます。

        ⚠️ この絞り込みは `status` の値に基づくため、**Salesforce 側で解約済みでも
        `active` / `inactive` に分類された行は除外されません**（CASE の評価順が原因。#28）。

        **行数について**: 応答は `mc_sims` ビューの行で、SIM の枚数と一致しないことがあります。
        同一 SIM が複数行に増幅する既知の問題があるためです（本番実測で約 0.3%）。
        件数だけが必要な場合は `GET /v1/sims/count` を使用してください。
      operationId: ListSims
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - name: limit
          in: query
          description: 取得件数（最大 1000）
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: offset
          in: query
          description: ページネーションオフセット
          schema:
            type: integer
            default: 0
        - name: order_by
          in: query
          description: ソートキー
          schema:
            type: string
            default: sim_id
            enum: [sim_id, customer_code, status]
        - name: order_direction
          in: query
          description: ソート方向
          schema:
            type: string
            default: asc
            enum: [asc, desc]
        - name: include_terminated
          in: query
          description: |
            `true`: 解約済み SIM **のみ** を返す / `false`: 解約済み SIM を除外する。
            名前に反して排他的な切り替えで、「解約済みを含む全件」を取得する手段は現状ありません。
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/SimIdPrefixFilter"
        - $ref: "#/components/parameters/MsisdnPrefixFilter"
        - name: filter_nulls
          in: query
          description: |
            `true`（既定）のとき、値が null のフィールドを **キーごと応答から除外** します
            （`null` として返るのではありません）。`false` にすると全フィールドが返り、
            値の無いものは `null` になります。
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sim"
              example:
                - sim_id: "8981080000000012345"
                  customer_code: "110000001"
                  application_start_date: "2026-01-06"
                  carrier_opening_date: "2026-01-06"
                  communication_generation: "4G"
                  dns_primary: "192.0.2.53"
                  dns_secondary: "192.0.2.54"
                  imsi: "440090000000001"
                  ip_address: "192.0.2.1"
                  ip_address_type: "動的IP"
                  ipv6_address_dns_primary: ""
                  ipv6_address_dns_secondary: ""
                  ipv6_address: ""
                  line_category: "フルMVNO(Ph2.1)"
                  line_status_from_mc: "開通"
                  lines_status: "開通"
                  opening_date: "2026-01-06"
                  msisdn: "812000000000001"
                  realm: "example.invalid"
                  service_category: "データ"
                  shipping_date: "2026-01-06"
                  apn: "example.invalid"
                  active_plan_name: "5GB/月 ライト/フル 制限時256kbps"
                  product_name: "5GB/月 ライト/フル 制限時256kbps"
                  sim_category: "マルチSIM"
                  product_name_id: "5GB/月 ライト/フル 制限時256kbps"
                  status: "ready"
                  session_status: "online"
                  session_created_at: "2026-08-18 22:54:11"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sims/{sim_id}:
    get:
      tags: [SIM Management]
      summary: SIM 詳細取得
      description: |
        特定の SIM の詳細情報を取得します。

        応答のフィールドは `GET /v1/sims` と同一です（同じ `Sim` スキーマ）。
      operationId: GetSim
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
        - name: filter_nulls
          in: query
          description: |
            `true`（既定）のとき、値が null のフィールドを **キーごと応答から除外** します
            （`null` として返るのではありません）。`false` にすると全フィールドが返り、
            値の無いものは `null` になります。
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sim"
              example:
                sim_id: "8981080000000012345"
                customer_code: "110000001"
                application_start_date: "2026-01-06"
                carrier_opening_date: "2026-01-06"
                communication_generation: "4G"
                dns_primary: "192.0.2.53"
                dns_secondary: "192.0.2.54"
                imsi: "440090000000001"
                ip_address: "192.0.2.1"
                ip_address_type: "動的IP"
                ipv6_address_dns_primary: ""
                ipv6_address_dns_secondary: ""
                ipv6_address: ""
                line_category: "フルMVNO(Ph2.1)"
                line_status_from_mc: "開通"
                lines_status: "開通"
                opening_date: "2026-01-06"
                msisdn: "812000000000001"
                realm: "example.invalid"
                service_category: "データ"
                shipping_date: "2026-01-06"
                apn: "example.invalid"
                active_plan_name: "5GB/月 ライト/フル 制限時256kbps"
                product_name: "5GB/月 ライト/フル 制限時256kbps"
                sim_category: "マルチSIM"
                product_name_id: "5GB/月 ライト/フル 制限時256kbps"
                status: "ready"
                session_status: "online"
                session_created_at: "2026-08-18 22:54:11"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sims/count:
    get:
      tags: [SIM Management]
      summary: SIM 件数取得
      description: |
        `GET /v1/sims` と同じ絞り込みに一致する行数を返します。
        一覧のフィルタ時件数表示や、CSV エクスポートへ誘導するかの判定に使用します。

        件数は `mc_sims` ビューの**行数**であり、SIM の枚数とは一致しません。
        絞り込みの条件・意味論は `GET /v1/sims` と共通です。
      operationId: CountSims
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - name: include_terminated
          in: query
          description: |
            `true`: 解約済み SIM **のみ** を返す / `false`: 解約済み SIM を除外する。
            名前に反して排他的な切り替えで、「解約済みを含む全件」を取得する手段は現状ありません。
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/SimIdPrefixFilter"
        - $ref: "#/components/parameters/MsisdnPrefixFilter"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimCount"
              example:
                count: 113683
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sims/summary:
    get:
      tags: [SIM Management]
      summary: SIM サマリー取得
      description: 顧客に紐づく全 SIM の集計サマリー情報を取得します。
      operationId: GetSimsSummary
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimSummary"
              example:
                customer_code: "110139701"
                total: 439
                subscribed: 426
                ready: 330
                active: 2
                online: 16
                terminated: 13
                unknown: 94
                updated_at: "2026-08-12T15:04:31Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===== Statistics =====
  /stats/sims/monthly_usage:
    get:
      tags: [Statistics]
      summary: 月次通信量（全 SIM）
      description: 顧客の全 SIM の月次通信量集計データを取得します（直近12ヶ月分、year_month 降順）。
      operationId: ListMonthlyUsage
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyUsage"
              example:
                - year_month: "2026-03"
                  downlink_bytes: 1500000000
                  uplink_bytes: 500000000
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /stats/sims/cumulative_usage:
    get:
      tags: [Statistics]
      summary: 全 SIM 累積通信量
      description: |
        顧客の全 SIM の累積通信量を一括取得します。日次で更新されます。

        30,000 件以下の場合は JSON 配列を直接返却します。
        30,000 件を超える場合は S3 にエクスポートし、署名付きダウンロード URL へ 302 リダイレクトします（NDJSON、`Content-Type: application/x-ndjson`、5分有効）。実体は gzip 圧縮されており、S3 側で `Content-Encoding: gzip` を付与するため、`curl --compressed` / requests / ブラウザなど標準的な HTTP クライアントは自動的に解凍します。
      operationId: ListCumulativeUsage
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功（30,000 件以下）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerCumulativeUsage"
              example:
                - sim_id: "8981080321000912770"
                  customer_code: "110139701"
                  msisdn: "812001004300889"
                  downlink_bytes: 50000000000
                  uplink_bytes: 15000000000
                  total_bytes: 65000000000
                  checked_at: "2026-03-06T00:00:00Z"
                  latest_record_time: "2026-03-06T00:00:00Z"
        "302":
          description: 大規模データ（30,000 件超）— S3 署名付き URL へリダイレクト
          headers:
            Location:
              description: "S3 presigned URL（NDJSON、`Content-Encoding: gzip` を付与、5分有効）"
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Snowflake 未設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stats/sims/current_plan_usage:
    get:
      tags: [Statistics]
      summary: 全 SIM 現プラン消費量
      description: |
        顧客の全 SIM の「現プランでの消費量」を一括取得します。

        各 SIM の `current_plan_used_bytes` は、累積通信量 (`total_bytes`)
        から最新の Executed リチャージ予約の `usage_offset_bytes` を引いた
        値です。`usage_offset_bytes` が記録されていない SIM では
        `current_plan_used_bytes` は `null` を返します。
      operationId: ListCurrentPlanUsage
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrentPlanUsage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Snowflake 未設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stats/sims/{sim_id}/current_plan_usage:
    get:
      tags: [Statistics]
      summary: SIM 現プラン消費量
      description: |
        特定 SIM の「現プランでの消費量」を取得します。

        `current_plan_used_bytes` は、累積通信量 (`total_bytes`) から
        最新の Executed リチャージ予約の `usage_offset_bytes` を引いた
        値です。`usage_offset_bytes` が記録されていない場合は `null` を
        返します。
      operationId: GetSimCurrentPlanUsage
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrentPlanUsage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Snowflake 未設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stats/sims/{sim_id}/monthly_usage:
    get:
      tags: [Statistics]
      summary: SIM 別月次通信量
      description: 特定 SIM の月次通信量を取得します（直近12ヶ月分、year_month 降順）。
      operationId: GetSimMonthlyUsage
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimMonthlyUsage"
              example:
                - sim_id: "SIM001"
                  customer_code: "110139701"
                  year_month: "2026-03"
                  downlink_bytes: 1000000000
                  uplink_bytes: 300000000
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /stats/sims/{sim_id}/details:
    get:
      tags: [Statistics]
      summary: SIM CDR（通信明細）
      description: 特定 SIM の通信明細（CDR）を取得します。直近 288 件（5 分粒度。連続してデータがある場合で約 24 時間分）のレコードが返却されます。
      operationId: GetSimUsageDetails
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CdrRecord"
              example:
                - sim_id: "SIM001"
                  customer_code: "110139701"
                  record_begins_at: "2026-03-06T10:30:00Z"
                  downlink_bytes: 50000000
                  uplink_bytes: 10000000
                  session_duration_seconds: 3600
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /stats/sims/{sim_id}/cumulative_usage:
    get:
      tags: [Statistics]
      summary: 累積通信量
      description: 特定 SIM の累積通信量を取得します。日次で更新されます。
      operationId: GetSimCumulativeUsage
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CumulativeUsage"
              example:
                - last_updated_at: "2026-03-06T00:00:00Z"
                  downlink_bytes: 50000000000
                  uplink_bytes: 15000000000
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===== Exports =====
  /exports:
    get:
      tags: [Exports]
      summary: エクスポート種別一覧
      description: 利用可能なエクスポート種別の一覧を取得します。
      operationId: ListExports
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  exports:
                    type: array
                    items:
                      type: string
              example:
                exports: ["sims"]

  /exports/sims:
    post:
      tags: [Exports]
      summary: SIM データエクスポート
      description: |
        SIM データのエクスポートをリクエストします。

        - **非同期モード**（デフォルト）: 即座に署名付きダウンロード URL を返却し、バックグラウンドで処理を実行します。
        - **同期モード**: 処理完了まで待機します。

        解約済み SIM は除外されます。
      operationId: CreateSimsExport
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - name: format
          in: query
          description: 出力形式
          schema:
            type: string
            default: csv
            enum: [csv, json, jsonl]
        - name: async
          in: query
          description: "`true`: 非同期処理（即時レスポンス）、`false`: 同期処理（完了待ち）"
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExportAsync"
                  - $ref: "#/components/schemas/ExportSync"
              examples:
                async:
                  summary: 非同期レスポンス
                  value:
                    file_name: "sims_export_110139801_01KABHF5NQGE8S4AT877421K6J.csv"
                    download_url: "https://mc-prod-exports.s3.amazonaws.com/..."
                    message: "Export is being processed. The file will be available shortly at the download URL."
                    expires_in_seconds: 86400
                sync:
                  summary: 同期レスポンス
                  value:
                    file_name: "sims_export_110139801_01KABHF5NQGE8S4AT877421K6J.csv"
                    row_count: 70
                    file_size_bytes: 29151
                    s3_url: "s3://mc-prod-exports/sims_export_110139801_..."
                    download_url: "https://mc-prod-exports.s3.amazonaws.com/..."
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===== Recharges =====
  /recharges/sims:
    get:
      tags: [Recharges]
      summary: リチャージ対象 SIM 一覧
      description: リチャージ対象となる SIM の一覧を取得します。各 SIM のリチャージ可否、現在のプラン情報、予約件数が含まれます。
      operationId: ListRechargeableSims
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - $ref: "#/components/parameters/IccidQuery"
        - $ref: "#/components/parameters/SimIdQuery"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeSimsResponse"
              example:
                sims:
                  - iccid: "8981080321000912770"
                    product_code: "PM058"
                    plan_type: capacity
                    extension_end_date: "2026-03-05"
                    reservation_count: 1
                    recharge_available: true
                    usage_offset_bytes: 647080707
                total_count: 2
                page_size: 200
                has_more: false
                next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /recharges/sims/{sim_id}/balance:
    get:
      tags: [Recharges]
      summary: SIM 残量取得
      description: |
        特定 SIM の現プラン容量（分母）・残り容量・使用量を取得します。
        マイページ等で「◯GB 中 ◯GB 残り」を描画する用途を想定しています。
        容量 3 値（`total_granted_bytes` / `total_remaining_bytes` / `used_bytes`）は capacity プランのみ値を持ち、
        daily プランおよび総枠未確定時（初回リチャージ前・プランマスタ未登録等）は `null` を返します。
      operationId: GetSimBalance
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM ID（ICCID、19-20 桁の数字）
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeSimBalance"
              example:
                sim_id: "8981080321000912770"
                plan_type: capacity
                total_granted_bytes: 6442450944
                total_remaining_bytes: 5368709120
                used_bytes: 1073741824
                banked_data_bytes: 1073741824
                filler_state: NORMAL
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 指定 SIM を当該顧客が所有していない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          description: 累積 usage 取得に失敗（古い値は返さない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /recharges/sims/{sim_id}/plans:
    get:
      tags: [Recharges]
      summary: SIM 別リチャージプラン
      description: 特定 SIM の現在のプランに基づいて、利用可能なリチャージプランを取得します。
      operationId: ListSimRechargePlans
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM ID（ICCID）
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
              example:
                plans:
                  - plan_code: "OI061331"
                    plan_type: capacity
                    capacity_limit: 10.0
                    daily_limit: null
                    duration_days: 30
                total_count: 2
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /recharges/plans:
    get:
      tags: [Recharges]
      summary: 全リチャージプラン一覧
      description: 顧客が利用可能な全リチャージプランのカタログを取得します。
      operationId: ListRechargePlans
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
              example:
                plans:
                  - plan_code: "OI061331"
                    plan_type: capacity
                    capacity_limit: 10.0
                    daily_limit: null
                    duration_days: 30
                  - plan_code: "OI061340"
                    plan_type: daily
                    capacity_limit: null
                    daily_limit: 3.0
                    duration_days: 90
                total_count: 3
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /recharges/plans/{plan_code}:
    get:
      tags: [Recharges]
      summary: プラン詳細
      description: 特定のリチャージプランの詳細情報を取得します。
      operationId: GetRechargePlan
      parameters:
        - name: plan_code
          in: path
          required: true
          description: プラン識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                plan_code: "OI061331"
                plan_type: capacity
                capacity_limit: 10.0
                daily_limit: null
                duration_days: 30
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /recharges/reservations:
    get:
      tags: [Recharges]
      summary: リチャージ予約一覧
      description: 顧客のリチャージ予約一覧を取得します。ICCID / SIM ID やステータスでのフィルタリングが可能です。
      operationId: ListRechargeReservations
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - $ref: "#/components/parameters/IccidQuery"
        - $ref: "#/components/parameters/SimIdQuery"
        - name: status
          in: query
          description: ステータスでフィルタ
          schema:
            type: string
            enum: [reserved, executed, failed]
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationsResponse"
              example:
                reservations:
                  - reservation_id: "RR-00012"
                    iccid: "8981080321000912770"
                    plan_code: "OI061331"
                    status: Executed
                    reserved_at: "2026-03-10T10:30:00Z"
                    executed_at: "2026-03-10T10:30:02Z"
                total_count: 1
                page_size: 200
                has_more: false
                next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
    post:
      tags: [Recharges]
      summary: リチャージ予約作成
      description: |
        SIM に対するリチャージ予約を作成します。1 つの SIM に対して最大 3 件の予約が可能です。

        **実行タイミング** — 予約したリチャージが実際に適用されるタイミングはプランタイプによって異なります。

        - `capacity`（容量上限型）：残データ量が 500MB 未満になった時点、または利用終了日の 21:00（JST）以降
        - `daily`（日次上限型）：利用終了日に到達後、毎日 20:00（JST）の日次処理で実行（残データ量による判定なし）

        ※ 上限が 500MB 以下の小容量プランでは、上限に到達した時点で実行されます。

        予約直後は `status` が `reserved` となり、実行後に `executed` へ変わります。
      operationId: CreateRechargeReservation
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
            example:
              sim_id: "8981080321000912770"
              plan_code: "OI061331"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              example:
                reservation_id: "RR-00012"
                status: 予約済み
                reserved_at: "2026-03-10T10:30:00Z"
                executed_at: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /recharges/immediate:
    post:
      tags: [Recharges]
      summary: 即時リチャージ（プラン即時書換・残量リセット）
      description: |
        ICCID とプランコードを指定して、**即時にプラン書換・残量リセット・PCRF 1 回 sync** を実行します。
        容量型プランのみ対象（日次型・CPFR・Internal はエラー）。予約の作成と実行をその場で行い、
        予約は即 `Executed` 化されます。

        `force=true` で既存 `Reserved` 予約を `Cancelled` 化して前倒し実行します。
        PCRF 同期中（`SyncStatus=実行中`）は force 不問で `409 ALREADY_SYNCING`。
      operationId: CreateImmediateRecharge
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImmediateRechargeRequest"
            example:
              sim_id: "8981080301011327143"
              plan_code: "OI071522"
              force: false
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmediateRechargeResponse"
              example:
                iccid: "8981080301011327143"
                plan_code: "OI071522"
                status: Executed
                reservation_id: "a1XRB000005P7Q12AK"
                sync_status: 実行中
                superseded_reservation_ids: []
                error_code: null
                message: "Immediate recharge executed. PCRF sync triggered."
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 指定 SIM に対するリチャージ権限がありません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 進行中予約あり、もしくは PCRF 同期中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          description: 累積 usage 取得失敗（DML 前に中断）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key

  parameters:
    CustomerCode:
      name: customer_code
      in: query
      description: |
        9桁の顧客コード。省略時は認証情報に紐づく顧客コードを使用します。
        指定する場合は認証情報のスコープと一致している必要があり、不一致の場合は 403 を返します。
      schema:
        type: string
        pattern: '^\d{9}$'
        example: "110139701"
    PageSize:
      name: page_size
      in: query
      description: 1ページあたりの件数
      schema:
        type: integer
        default: 200
    Cursor:
      name: cursor
      in: query
      description: ページネーションカーソル
      schema:
        type: string
    IccidQuery:
      name: iccid
      in: query
      description: "（後方互換）SIM の ICCID でフィルタ。`sim_id` の使用を推奨。`sim_id` と併用された場合は `iccid` を優先"
      schema:
        type: string
      deprecated: true
    SimIdQuery:
      name: sim_id
      in: query
      description: SIM ID (ICCID のエイリアス) でフィルタ
      schema:
        type: string
    SimIdPrefixFilter:
      name: sim_id
      in: query
      description: |
        SIM 識別子（`sim_id`）の**前方一致**で絞り込みます（#76）。

        - **英数字**・32 文字以内。条件を満たさない値（記号を含むもの）・空文字は **400**
        - **小文字は大文字として扱います**（`ab123` と `AB123` は同じ結果）。
          格納値が英大文字と数字のみのためです
        - ⚠️ **`sim_id` は ICCID とは限りません。** 19 桁の数字（ICCID）と、
          英大文字 2 文字 + 数字 13 桁の 15 桁の識別子が混在し、後者が約 37% を
          占めます（2026-08-21 本番実測）。前方一致の桁数を ICCID 前提で
          決め打ちしないでください
        - 他の絞り込み条件とは **AND** で結合します

        ⚠️ **`/v1/recharges/sims` の `sim_id` とは一致方式が違います。**
        あちらは**完全一致**（`recharges/lambda_function.py` のクライアント側フィルタ）で、
        こちらは前方一致です。同じパラメータ名なので取り違えに注意してください。
      schema:
        type: string
        pattern: '^[0-9A-Za-z]+$'
        maxLength: 32
        example: "8981080"
    MsisdnPrefixFilter:
      name: msisdn
      in: query
      description: |
        電話番号（MSISDN）の**前方一致**で絞り込みます（#76）。

        処理は次の順序で行います（`pattern` は入力の形を緩く示したものなので、
        受理されるかどうかはこの順序が決めます）:

        1. **区切り文字（ハイフン `-`・半角/全角スペース・括弧 `(` `)`）を除去**します
           （`070-1234-5678` と `07012345678` は同じ結果）
        2. **国番号に変換**します。先頭の `+` は落とし（`%2B8140` → `8140`）、
           先頭が `00` ならそれを落とし（`00819012` → `819012`）、
           先頭が `0` なら `81` に置き換えます（`07012` → `817012`）。
           `mc_sims.msisdn` が国番号付き（`8140...`）で格納されているためです
        3. **変換後の値**を検証します。数字のみ・空でない・**32 文字以内**であること。
           満たさない場合は **400**（全角数字・記号を含む値、`---` のように除去すると
           空になる入力、変換後に 32 文字を超えるものが該当）

        先頭の `+` は、生の `+` でもパーセントエンコード（`%2B`）でも同じ結果になります
        （前者は空白としてデコードされたうえで、1. の区切り文字として除去されるため）。
      schema:
        # 区切り文字を含む入力も受け付ける。数字のみ・32 文字以内の判定は
        # 区切り文字を除いた後の値に対して行われるため、maxLength は置かない。
        type: string
        pattern: '^\+?[0-9()\- 　]+$'
        example: "070-1234-5678"

  schemas:
    # ----- SIM -----
    Sim:
      type: object
      description: |
        `GET /v1/sims` / `GET /v1/sims/{sim_id}` の応答。`mc_sims` ビューの 37 列に対応する。

        `filter_nulls=true`（既定）のとき、値が null のフィールドは **キーごと応答から消える**
        （`null` として返るのではない）。`nullable: true` が効くのは `filter_nulls=false` のとき。
      properties:
        sim_id:
          type: string
          description: |
            SIM 識別子（`sf.inventory.Name`）。**ICCID とは限りません。**
            19 桁の数字（ICCID）と、英大文字 2 文字 + 数字 13 桁の 15 桁の識別子が
            混在し、後者が約 37% を占めます（2026-08-21 本番実測）。
        customer_code:
          type: string
          description: 顧客コード（9桁）
        application_start_date:
          type: string
          format: date
          nullable: true
          description: 申込開始日
        cancellation_mobile_core_date:
          type: string
          format: date
          nullable: true
          description: モバイルコア解約日
        carrier_opening_date:
          type: string
          format: date
          nullable: true
          description: キャリア開通日
        carrier_withdrawal_date:
          type: string
          format: date
          nullable: true
          description: キャリア脱退日
        communication_generation:
          type: string
          nullable: true
          description: 通信世代（4G/5G 等）
        dns_primary:
          type: string
          nullable: true
          description: プライマリ DNS
        dns_secondary:
          type: string
          nullable: true
          description: セカンダリ DNS
        extension_end_date:
          type: string
          format: date
          nullable: true
          description: 延長終了日
        first_communicating_date:
          type: string
          format: date
          nullable: true
          description: 初回通信日
        imsi:
          type: string
          description: IMSI。実データでは 38% が空文字
        ip_address:
          type: string
          nullable: true
          description: IP アドレス
        ip_address_type:
          type: string
          nullable: true
          description: IP アドレス種別
        ipv6_address_dns_primary:
          type: string
          description: IPv6 プライマリ DNS。実データでは 100% が空文字
        ipv6_address_dns_secondary:
          type: string
          description: IPv6 セカンダリ DNS。実データでは 100% が空文字
        ipv6_address:
          type: string
          description: IPv6 アドレス。実データでは 100% が空文字
        line_category:
          type: string
          nullable: true
          description: 回線種別
        line_status_from_mc:
          type: string
          nullable: true
          description: MC 側の回線状態
        line_stoped_date:
          type: string
          format: date
          nullable: true
          description: 回線停止日
        lines_status:
          type: string
          nullable: true
          description: 回線状態
        linestarted_date:
          type: string
          format: date
          nullable: true
          description: 回線開始日
        opening_date:
          type: string
          format: date
          nullable: true
          description: 開通日
        msisdn:
          type: string
          description: 電話番号。実データでは 11% が空文字
        realm:
          type: string
          nullable: true
          description: レルム
        service_category:
          type: string
          nullable: true
          description: サービス種別
        use_start_expiration_date:
          type: string
          format: date
          nullable: true
          description: 利用開始期限
        shipping_date:
          type: string
          format: date
          nullable: true
          description: 出荷日
        apn:
          type: string
          description: APN。実データでは 24% が空文字
        active_plan_name:
          type: string
          description: 現在適用中のプラン名（商談商品名）。`plan_detail` に相当する。実データでは 15% が空文字
        product_name:
          type: string
          description: 商品名。実データ上 `active_plan_name` と同値。実データでは 15% が空文字
        sim_category:
          type: string
          nullable: true
          description: SIM 種別
        product_name_id:
          type: string
          description: 商品名 ID。名称に反して ID ではなく、`product_name` とは別の商品名が入る。実データでは 15% が空文字
        status:
          type: string
          enum: [stock, ready, active, inactive, terminated, unknown]
          description: |
            回線状態。Salesforce の状態フィールドから CASE 式で導出され、上から順に評価されます
            （`stock` → `ready` → `active` → `inactive` → `terminated` → `unknown`）。

            **`SimSummary` との対応**: `ready` / `active` / `terminated` / `unknown` は共通ですが、
            `stock` と `inactive` はサマリに出力されません。逆にサマリの `subscribed` は
            `status <> 'terminated'` の集計値で、この enum には対応する値がありません（#16）。

            ⚠️ **`active` の件数を稼働回線数として扱わないでください。** 評価順の都合で
            `ready` の条件が先に当たるため、実際に稼働している回線の大半が `ready` に分類されます
            （本番実測: `active` は 200 万行中 42 行、うち 17 行は Salesforce 側で解約済み）。
            この判定ロジックの見直しは #28 で扱います。
        session_status:
          type: string
          enum: [online, offline]
          description: セッション接続状態。開始済みかつ未終了の CDR がある場合に `online`
        session_created_at:
          type: string
          nullable: true
          description: |
            最新セッションの開始時刻。
            **RFC 3339 形式ではありません。** 実応答は `"2026-08-18 22:54:11"` のように
            スペース区切り・タイムゾーンなしの文字列です（RDS Data API が返す形式のまま）。
            ISO 8601 化は #16 で扱います。
        session_terminated_at:
          type: string
          nullable: true
          description: |
            最新セッションの終了時刻。
            **RFC 3339 形式ではありません。** 実応答は `"2026-08-18 22:54:11"` のように
            スペース区切り・タイムゾーンなしの文字列です（RDS Data API が返す形式のまま）。
            ISO 8601 化は #16 で扱います。

    SimCount:
      type: object
      description: |
        `GET /v1/sims` と同じ絞り込みに一致する `mc_sims` ビューの行数。
        SIM の枚数ではありません。
      required: [count]
      properties:
        count:
          type: integer
          description: 一致した行数

    SimSummary:
      type: object
      description: |
        顧客に紐づく SIM のステータス別集計。各件数は `mc_sims` の行数を数えたもの。
      properties:
        customer_code:
          type: string
          description: 顧客コード
        total:
          type: integer
          description: 全件
        subscribed:
          type: integer
          description: 解約以外（在庫・停止を含む）
        ready:
          type: integer
          description: 開通済みで出荷済み
        active:
          type: integer
          description: 稼働中
        online:
          type: integer
          description: セッション接続中
        terminated:
          type: integer
          description: 解約済み
        unknown:
          type: integer
          description: 上記のいずれにも該当しない
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: |
            集計元データ（`sf.inventory`）の最終更新時刻。当該顧客のレコードのうち
            Salesforce 上で最後に更新されたものの時刻を返す（同期パイプラインの実行時刻ではない）。
            対象レコードが無い場合は null。

    # ----- Statistics -----
    MonthlyUsage:
      type: object
      properties:
        year_month:
          type: string
          example: "2026-03"
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer

    SimMonthlyUsage:
      allOf:
        - type: object
          properties:
            sim_id:
              type: string
            customer_code:
              type: string
        - $ref: "#/components/schemas/MonthlyUsage"

    CdrRecord:
      type: object
      properties:
        sim_id:
          type: string
        customer_code:
          type: string
        record_begins_at:
          type: string
          format: date-time
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer
        session_duration_seconds:
          type: integer

    CumulativeUsage:
      type: object
      properties:
        last_updated_at:
          type: string
          format: date-time
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer

    CustomerCumulativeUsage:
      type: object
      properties:
        sim_id:
          type: string
          description: SIM 識別子 (ICCID)
        customer_code:
          type: string
        msisdn:
          type: string
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer
        total_bytes:
          type: integer
        checked_at:
          type: string
          format: date-time
        latest_record_time:
          type: string
          format: date-time

    CurrentPlanUsage:
      type: object
      properties:
        sim_id:
          type: string
          description: SIM 識別子 (ICCID)
        customer_code:
          type: string
        msisdn:
          type: string
        downlink_bytes:
          type: integer
        uplink_bytes:
          type: integer
        total_bytes:
          type: integer
          description: 累積通信量
        checked_at:
          type: string
          format: date-time
        latest_record_time:
          type: string
          format: date-time
        plan_code:
          type: string
          nullable: true
          description: 最新の Executed リチャージ予約のプランコード
        plan_started_at:
          type: string
          format: date-time
          nullable: true
          description: 現プラン開始時刻 (最新 Executed リチャージ予約の実行日時)
        usage_offset_bytes:
          type: integer
          nullable: true
          description: プラン適用時点の累積通信量
        current_plan_used_bytes:
          type: integer
          nullable: true
          description: 現プランでの消費量 = total_bytes − usage_offset_bytes (offset 不明時は null)

    # ----- Exports -----
    ExportAsync:
      type: object
      properties:
        file_name:
          type: string
        download_url:
          type: string
        message:
          type: string
        expires_in_seconds:
          type: integer

    ExportSync:
      type: object
      properties:
        file_name:
          type: string
        row_count:
          type: integer
        file_size_bytes:
          type: integer
        s3_url:
          type: string
        download_url:
          type: string

    # ----- Recharges -----
    RechargeSim:
      type: object
      properties:
        iccid:
          type: string
        product_code:
          type: string
        plan_type:
          type: string
          enum: [capacity, daily]
        extension_end_date:
          type: string
          format: date
        reservation_count:
          type: integer
        recharge_available:
          type: boolean
        usage_offset_bytes:
          type: integer
          description: |
            現プランの容量計算の起点バイト数（直近実行済み予約の通算転送容量オフセット）。
            `現プラン使用量 = 通算転送容量 − usage_offset_bytes` で算出。未リチャージ時は 0。

    RechargeSimsResponse:
      type: object
      properties:
        sims:
          type: array
          items:
            $ref: "#/components/schemas/RechargeSim"
        total_count:
          type: integer
        page_size:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true

    RechargeSimBalance:
      type: object
      description: |
        SIM の現プラン容量・残量・使用量。容量 3 値は capacity プランのみ値を持ち、
        daily プランおよび総枠未確定時（初回リチャージ前・プランマスタ未登録等）は `null` を返します。
      properties:
        sim_id:
          type: string
          description: SIM の一意識別子（ICCID）
        plan_type:
          type: string
          enum: [capacity, daily]
          nullable: true
          description: プランタイプ。プランマスタ未登録時は `null`
        total_granted_bytes:
          type: integer
          nullable: true
          description: 付与容量＝現プランで使える総容量（bytes、分母）。capacity プランのみ
        total_remaining_bytes:
          type: integer
          nullable: true
          description: 利用可能残量（bytes、分子）。`0 ≤ remaining ≤ total_granted_bytes` にクランプ済み。capacity プランのみ
        used_bytes:
          type: integer
          nullable: true
          description: 現プランになってからの使用量（bytes、= `total_granted_bytes − total_remaining_bytes`）。capacity プランのみ
        banked_data_bytes:
          type: integer
          nullable: true
          description: Banked Data 残高（bytes）。capacity プランのみ
        filler_state:
          type: string
          enum: [NORMAL, FILLER_LARGE, FILLER_SMALL]
          description: Filler 状態。UI が「枯渇」と低速モードを区別する補助情報

    Plan:
      type: object
      properties:
        plan_code:
          type: string
        plan_type:
          type: string
          enum: [capacity, daily]
        capacity_limit:
          type: number
          nullable: true
          description: GB 上限（capacity プランのみ）
        daily_limit:
          type: number
          nullable: true
          description: 日次 GB 上限（daily プランのみ）
        duration_days:
          type: integer
        plan_detail:
          type: string
          nullable: true
          description: プラン詳細（商談商品名）

    PlansResponse:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
        total_count:
          type: integer

    CreateReservationRequest:
      type: object
      required: [plan_code]
      description: |
        `iccid` または `sim_id` のいずれか必須。両指定 + 異なる値、または両欠落は 400 を返します。両指定 + 同値は許容。
        `sim_id` の使用を推奨します（`iccid` は後方互換のため残しています）。
      properties:
        iccid:
          type: string
          description: "（後方互換）対象 SIM の ICCID。`sim_id` の使用を推奨"
          deprecated: true
        sim_id:
          type: string
          description: SIM ID（ICCID のエイリアス）
        plan_code:
          type: string
          description: リチャージプランコード

    Reservation:
      type: object
      properties:
        reservation_id:
          type: string
        status:
          type: string
        reserved_at:
          type: string
          format: date-time
        executed_at:
          type: string
          format: date-time
          nullable: true
          description: 実行日時（未実行時 null）

    ReservationDetail:
      allOf:
        - $ref: "#/components/schemas/Reservation"
        - type: object
          properties:
            iccid:
              type: string
              description: "（後方互換）SIM の ICCID。`sim_id` の使用を推奨"
              deprecated: true
            sim_id:
              type: string
              description: SIM の一意識別子（ICCID）
            plan_code:
              type: string

    ImmediateRechargeRequest:
      type: object
      required: [plan_code]
      description: |
        `iccid` または `sim_id` のいずれか必須。両指定 + 異なる値、または両欠落は 400 を返します。両指定 + 同値は許容。
        `sim_id` の使用を推奨します（`iccid` は後方互換のため残しています）。
      properties:
        iccid:
          type: string
          description: "（後方互換）対象 SIM の ICCID（19-20 桁）。`sim_id` の使用を推奨"
          deprecated: true
        sim_id:
          type: string
          description: SIM ID（ICCID のエイリアス）
        plan_code:
          type: string
          description: 書き換え先プランコード（容量型のみ）
        force:
          type: boolean
          default: false
          description: |
            `true` のとき既存 `Reserved` 予約を Cancelled 化して前倒し実行する。
            既定 `false` の場合は進行中予約があると `409 RESERVATION_EXISTS`。

    ImmediateRechargeResponse:
      type: object
      description: |
        即時リチャージ結果。成功時は `status='Executed'` で `reservation_id` 等が埋まる。
      properties:
        iccid:
          type: string
        plan_code:
          type: string
        status:
          type: string
          nullable: true
          description: 予約ステータス（成功時 `Executed`）
        reservation_id:
          type: string
          nullable: true
          description: 生成された予約レコード ID
        sync_status:
          type: string
          nullable: true
          description: Inventory の同期ステータス（成功時 `実行中` → 下流で `実行済`）
        superseded_reservation_ids:
          type: array
          items:
            type: string
          description: force で Cancelled 化した既存 Reserved 予約 ID
        error_code:
          type: string
          nullable: true
        message:
          type: string

    ReservationsResponse:
      type: object
      properties:
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/ReservationDetail"
        total_count:
          type: integer
        page_size:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true

    # ----- Common -----
    Error:
      type: object
      properties:
        detail:
          oneOf:
            - type: string
            - type: object
              properties:
                errorCode:
                  type: string
                message:
                  type: string

  responses:
    BadRequest:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 認可情報が伴わないリクエスト
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        認証スコープ外の要求。
        `customer_code` に認証情報と異なる顧客コードを指定した場合、または認証情報に顧客スコープが無い場合。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: リソースが見つからない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: 上流サービスエラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
