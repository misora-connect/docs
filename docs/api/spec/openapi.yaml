  /recharges/sims/{sim_id}/balance:
    get:
      tags: [Recharges]
      summary: GetSimBalance — SIM 残量取得
      description: |
        特定 SIM の使える総量・残り容量・使用量を取得します。
        マイページ等で「◯GB 中 ◯GB 残り」を描画する用途を想定しています。

        **繰越（Banked Data）の扱い**: 使える総量 = 現プラン容量 + 繰越（未消化分 = Banked Data）。
        消費順序は 現プラン → 繰越で、現プランの枯渇または期間満了時に繰越分は自動的に払い出されます
        （お客様の操作は不要で、通信は途切れません）。したがって残量は現プランと繰越をまたいで連続して減ります。
        繰越は無期限ではなく、払い出し用の内部プランの期間終了時に消滅します。

        容量 3 値（`total_granted_bytes` / `total_remaining_bytes` / `used_bytes`）は capacity プランのみ値を持ち、
        daily プランおよび総枠未確定時（初回リチャージ前・プランマスタ未登録等）は `null` を返します。

        **daily プラン（1GB/day 等）**: 通算残量の概念を持たないため容量 3 値は `null` のまま、
        当日枠を `daily_limit_bytes` / `daily_used_bytes` / `daily_remaining_bytes` で返します。
        当日利用量は **日本時間の 0:00 以降**の実績を集計したもので、日付が変わると 0 に戻ります。
        日次上限のないプラン（無制限）や、リセット周期が 1 日でないプランでは上限・残量が `null` になり、
        当日利用量のみを返します。

        レスポンスは全プランタイプで同一のスキーマです。capacity プランでは `daily_*` が、
        daily プランでは容量 3 値が、それぞれ `null` として含まれます。

        **解約済み SIM**: 残量は返さず `400`（`errorCode: BAD_REQUEST` / `message: SIM is terminated`）になります。
        `GET /v1/sims` で `include_terminated=true` を指定して取得した SIM や、解約直後で一覧にまだ残っている SIM に
        対して本 API を呼ぶとこの応答になります。解約済み SIM はリチャージ対象外のため、`GET /v1/recharges/sims`
        の一覧には含まれません。

        累積 usage の取得に失敗した場合は `503` を返し、古い残量値は返しません（stale データを防ぐ）。
      operationId: GetSimBalance
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - name: sim_id
          in: path
          required: true
          description: SIM ID（ICCID、19-20 桁の数字）
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeSimBalance"
              examples:
                capacity:
                  summary: capacity プラン（容量型）
                  value:
                    iccid: "8981080321000912770"
                    plan_type: capacity
                    total_granted_bytes: 6442450944
                    total_remaining_bytes: 5368709120
                    used_bytes: 1073741824
                    banked_data_bytes: 1073741824
                    filler_state: NORMAL
                    checked_at: "2026-08-26T05:30:00Z"
                    latest_record_time: "2026-08-25T15:00:00Z"
                    daily_limit_bytes: null
                    daily_used_bytes: null
                    daily_remaining_bytes: null
                    error_code: null
                    message: null
                daily:
                  summary: daily プラン（日次型・1GB/day）
                  value:
                    iccid: "8981080321000912788"
                    plan_type: daily
                    total_granted_bytes: null
                    total_remaining_bytes: null
                    used_bytes: null
                    banked_data_bytes: null
                    filler_state: NORMAL
                    checked_at: "2026-09-03T05:30:00Z"
                    latest_record_time: "2026-09-03T05:18:00Z"
                    daily_limit_bytes: 1073741824
                    daily_used_bytes: 268435456
                    daily_remaining_bytes: 805306368
                    error_code: null
                    message: null
        "400":
          description: |
            バリデーションエラー。残量取得側の検証エラーは `detail` がオブジェクトで、`detail.message` で原因を判別できます。
            （クエリパラメータの検証で弾かれた場合は `detail` が文字列になります。`Error` スキーマ参照）

            - `Invalid ICCID format` — ICCID が 19-20 桁の数字でない
            - `SIM is terminated` — 解約済み SIM（残量は返しません）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                terminated:
                  summary: 解約済み SIM
                  value:
                    detail:
                      errorCode: BAD_REQUEST
                      message: SIM is terminated
                invalidIccid:
                  summary: ICCID 形式不正
                  value:
                    detail:
                      errorCode: BAD_REQUEST
                      message: Invalid ICCID format
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: サーバー内部エラー（想定外の例外）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 累積 usage の取得に失敗（古い値は返さない）

