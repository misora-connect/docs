openapi: 3.0.3
info:
  title: Misora Connect API
  description: |
    SIM の管理、通信量の統計、データエクスポート、リチャージなどの機能を提供する REST API です。

    ## Authentication
    全てのリクエストに `x-api-key` ヘッダが必要です。

    ## Customer Code
    顧客スコープは認証情報（API Key / トークン）から決まります。`customer_code`（9桁数字）は省略可能で、省略時は認証情報に紐づく顧客コードが自動的に使用されます。

    明示的に指定する場合は、認証情報のスコープと一致している必要があります。異なる顧客コードを指定したリクエストは `403` で拒否されます（指定が無視されて別のデータが返ることはありません）。

    ## レスポンス形式
    全て JSON 形式で返却されます。

    ## 日時の表記
    日時を返す全てのフィールドは **RFC 3339 / ISO 8601 の UTC 表記** で統一されています。

    ```
    YYYY-MM-DDTHH:MM:SSZ      例: 2026-08-14T06:45:49Z
    ```

    - 日付と時刻の区切りは `T`、終端の `Z` は UTC を表します。**オフセットが無い日時は返しません。**
    - **秒精度です。** ミリ秒・マイクロ秒は返しません。
    - 値が無い場合は `null` を返します（`"1970-01-01T00:00:00Z"` のような代替値は返しません）。
    - 日付のみのフィールド（`opening_date` など、`format: date`）は `YYYY-MM-DD` です。
      時刻を持たないため、日時に格上げされることはありません。
    - `year_month` は `YYYYMM` の月識別子であり、日付ではありません（`format: date` / `date-time` の対象外）。

    ローカル時刻で表示したい場合は、受け取った UTC の値をクライアント側で変換してください。
    日本時間は UTC + 9 時間です（日本には夏時間がありません）。
  version: "1.0"

servers:
  - url: https://api.misora-connect.com/v1
    description: Production

security:
  - ApiKeyAuth: []

tags:
  - name: SIM Management
    description: SIM の一覧取得、詳細情報の参照、サマリー統計の取得
  - name: Statistics
    description: SIM の通信量統計・CDR（通信明細）・累積使用量
  - name: Exports
    description: SIM データの CSV/JSON/JSONL エクスポート
  - name: Recharges
    description: SIM プランのリチャージ（容量追加）管理

paths:
  # ===== SIM Management =====
  /sims:
    get:
      tags: [SIM Management]
      summary: SIM 一覧取得
      description: |
        顧客に紐づく SIM のページネーション付き一覧を取得します。

        **母集団**: 既定（`include_terminated=false`）では `status <> 'terminated'` が対象です。
        在庫（`stock`）・停止（`inactive`）も含まれます。`include_terminated=true` では
        解約済みを含む全行が対象です。

        ⚠️ この絞り込みは `status` の値に基づくため、**Salesforce 側で解約済みでも
        `active` / `inactive` に分類された行は除外されません**（CASE の評価順が原因。#28）。

        **行数について**: 応答は `mc_sims` ビューの行で、SIM の枚数と一致しないことがあります。
        同一 SIM が複数行に増幅する既知の問題があるためです（本番実測で約 0.3%）。
        件数だけが必要な場合は `GET /v1/sims/count` を使用してください。
      operationId: ListSims
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - name: limit
          in: query
          description: 取得件数（最大 1000）
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: offset
          in: query
          description: ページネーションオフセット
          schema:
            type: integer
            default: 0
        - name: order_by
          in: query
          description: ソートキー
          schema:
            type: string
            default: sim_id
            enum: [sim_id, customer_code, status]
        - name: order_direction
          in: query
          description: ソート方向
          schema:
            type: string
            default: asc
            enum: [asc, desc]
        - name: include_terminated
          in: query
          description: |
            `true`: 解約済み SIM を**含む全件**を返す / `false`: 解約済み SIM を除外する。

            ⚠️ 2026-09 以前は `true` が「解約済み**のみ**」を返す排他的な切り替えでした。
            `true` と `false` の 2 回呼びで全件を合成していた場合は `true` 1 回に置き換えてください
            （そのままだと二重計上になります）。
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/SimIdPrefixFilter"
        - $ref: "#/components/parameters/MsisdnPrefixFilter"
        - name: filter_nulls
          in: query
          description: |
            `true`（既定）のとき、値が null のフィールドを **キーごと応答から除外** します
            （`null` として返るのではありません）。`false` にすると全フィールドが返り、
            値の無いものは `null` になります。
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sim"
              example:
                - sim_id: "8981080000000012345"
                  customer_code: "110000001"
                  application_start_date: "2026-01-06"
                  carrier_opening_date: "2026-01-06"
                  communication_generation: "4G"
                  dns_primary: "192.0.2.53"
                  dns_secondary: "192.0.2.54"
                  imsi: "440090000000001"
                  ip_address: "192.0.2.1"
                  ip_address_type: "動的IP"
                  ipv6_address_dns_primary: ""
                  ipv6_address_dns_secondary: ""
                  ipv6_address: ""
                  line_category: "フルMVNO(Ph2.1)"
                  line_status_from_mc: "開通"
                  lines_status: "開通"
                  opening_date: "2026-01-06"
                  msisdn: "812000000000001"
                  realm: "example.invalid"
                  service_category: "データ"
                  shipping_date: "2026-01-06"
                  apn: "example.invalid"
                  active_plan_name: "5GB/月 ライト/フル 制限時256kbps"
                  product_name: "5GB/月 ライト/フル 制限時256kbps"
                  sim_category: "マルチSIM"
                  product_name_id: "5GB/月 ライト/フル 制限時256kbps"
                  status: "ready"
                  session_status: "online"
                  session_created_at: "2026-08-18T22:54:11Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sims/{sim_id}:
    get:
      tags: [SIM Management]
      summary: SIM 詳細取得
      description: |
        特定の SIM の詳細情報を取得します。

        `GET /v1/sims` の全フィールドに加えて、備考 `note` を返します（`SimDetail` スキーマ）。
        `note` は明細でのみ返り、一覧・CSV エクスポートには含まれません。
      operationId: GetSim
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
        - name: filter_nulls
          in: query
          description: |
            `true`（既定）のとき、値が null のフィールドを **キーごと応答から除外** します
            （`null` として返るのではありません）。`false` にすると全フィールドが返り、
            値の無いものは `null` になります。
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimDetail"
              example:
                sim_id: "8981080000000012345"
                customer_code: "110000001"
                application_start_date: "2026-01-06"
                carrier_opening_date: "2026-01-06"
                communication_generation: "4G"
                dns_primary: "192.0.2.53"
                dns_secondary: "192.0.2.54"
                imsi: "440090000000001"
                ip_address: "192.0.2.1"
                ip_address_type: "動的IP"
                ipv6_address_dns_primary: ""
                ipv6_address_dns_secondary: ""
                ipv6_address: ""
                line_category: "フルMVNO(Ph2.1)"
                line_status_from_mc: "開通"
                lines_status: "開通"
                opening_date: "2026-01-06"
                msisdn: "812000000000001"
                realm: "example.invalid"
                service_category: "データ"
                shipping_date: "2026-01-06"
                apn: "example.invalid"
                active_plan_name: "5GB/月 ライト/フル 制限時256kbps"
                product_name: "5GB/月 ライト/フル 制限時256kbps"
                sim_category: "マルチSIM"
                product_name_id: "5GB/月 ライト/フル 制限時256kbps"
                status: "ready"
                session_status: "online"
                session_created_at: "2026-08-18T22:54:11Z"
                note: "不良SIMのため交換対応済み"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sims/count:
    get:
      tags: [SIM Management]
      summary: SIM 件数取得
      description: |
        `GET /v1/sims` と同じ絞り込みに一致する行数を返します。
        一覧のフィルタ時件数表示や、CSV エクスポートへ誘導するかの判定に使用します。

        件数は `mc_sims` ビューの**行数**であり、SIM の枚数とは一致しません。
        絞り込みの条件・意味論は `GET /v1/sims` と共通です。
      operationId: CountSims
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - name: include_terminated
          in: query
          description: |
            `true`: 解約済み SIM を**含む全件**を数える / `false`: 解約済み SIM を除外する。

            ⚠️ 2026-09 以前は `true` が「解約済み**のみ**」を数える排他的な切り替えでした。
            `true` と `false` の 2 回呼びで全件を合算していた場合は `true` 1 回に置き換えてください。
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/SimIdPrefixFilter"
        - $ref: "#/components/parameters/MsisdnPrefixFilter"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimCount"
              example:
                count: 113683
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sims/summary:
    get:
      tags: [SIM Management]
      summary: SIM サマリー取得
      description: 顧客に紐づく全 SIM の集計サマリー情報を取得します。
      operationId: GetSimsSummary
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimSummary"
              example:
                customer_code: "110139701"
                total: 439
                subscribed: 426
                ready: 330
                active: 2
                online: 16
                terminated: 13
                unknown: 94
                updated_at: "2026-08-12T15:04:31Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===== Statistics =====
  /stats/sims/monthly_usage:
    get:
      tags: [Statistics]
      summary: 月次通信量（全 SIM）
      description: |
        顧客の全 SIM の月次通信量集計データを取得します（直近12ヶ月分、year_month 降順）。

        SIM 再発行が発生した月に Salesforce が作る**合計行（旧 + 新の合算行）は集計から除外**されます（旧SIM 行と新SIM 行はそれぞれ合算されます）。除外しないと再発行月は二重計上になります。詳細は `/v1/stats/sims/monthly_usage_by_sim` の `reissue_category` を参照してください。

        該当データが無い場合は空配列 `[]` を返します（200）。
      operationId: ListMonthlyUsage
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功（該当なしは空配列 `[]`）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyUsage"
              example:
                - year_month: "202603"
                  downlink_bytes: 1500000000
                  uplink_bytes: 500000000
        "400":
          $ref: "#/components/responses/BadRequest"

  /stats/sims/monthly_usage_by_sim:
    get:
      tags: [Statistics]
      summary: 月次通信量（指定月・SIM 別内訳）
      description: |
        指定月に**利用実績のある SIM のみ**の通信量内訳を返します（`sim_id` 昇順）。通信のない契約中 SIM は含まれません。

        ⚠️ **本 EP は `合計行`（SIM 再発行月の 旧 + 新の合算行）を含みます**。単純合計すると再発行月は二重計上になるため、集計する場合は `reissue_category='total'` の行を除外するか、`new` / `old` を集計してください。

        ⚠️ 集計 EP の `/v1/stats/sims/monthly_usage` は逆に `合計行` を除外しており、**本 EP が `合計行` を含む・集計 EP は除外する、という非対称は意図的**です（本 EP は生の実績を、集計 EP は請求根拠となる合算値を返すため）。

        該当データが無い場合は空配列 `[]` を返します（200）。
      operationId: GetMonthlyUsageBySim
      parameters:
        - name: year_month
          in: query
          required: true
          description: 対象月（`YYYYMM` 6 桁ゼロ埋め）
          schema:
            type: string
            pattern: '^\d{4}(0[1-9]|1[0-2])$'
            example: "202608"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功（該当なしは空配列 `[]`）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyUsageBySim"
              example:
                - sim_id: "8981080321000912770"
                  year_month: "202608"
                  msisdn: "812001004300889"
                  plan_name: "IoT Standard 3GB"
                  downlink_bytes: 234567890
                  uplink_bytes: 12345678
                  total_bytes: 246913568
                  reissue_category: null
                - sim_id: "8981080321000913322"
                  year_month: "202608"
                  msisdn: "812001004300911"
                  plan_name: "IoT Standard 3GB"
                  downlink_bytes: 15667981
                  uplink_bytes: 900000
                  total_bytes: 16567981
                  reissue_category: "total"
        "400":
          $ref: "#/components/responses/BadRequest"

  /stats/sims/cumulative_usage:
    get:
      tags: [Statistics]
      summary: 全 SIM 累積通信量
      description: |
        顧客の全 SIM の累積通信量を一括取得します。日次で更新されます。

        30,000 件以下の場合は JSON 配列を直接返却します。
        30,000 件を超える場合は S3 にエクスポートし、署名付きダウンロード URL へ 302 リダイレクトします（NDJSON、`Content-Type: application/x-ndjson`、5分有効）。実体は gzip 圧縮されており、S3 側で `Content-Encoding: gzip` を付与するため、`curl --compressed` / requests / ブラウザなど標準的な HTTP クライアントは自動的に解凍します。
      operationId: ListCumulativeUsage
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功（30,000 件以下）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerCumulativeUsage"
              example:
                - sim_id: "8981080321000912770"
                  customer_code: "110139701"
                  msisdn: "812001004300889"
                  downlink_bytes: 50000000000
                  uplink_bytes: 15000000000
                  total_bytes: 65000000000
                  checked_at: "2026-03-06T00:00:00Z"
                  latest_record_time: "2026-03-06T00:00:00Z"
        "302":
          description: 大規模データ（30,000 件超）— S3 署名付き URL へリダイレクト
          headers:
            Location:
              description: "S3 presigned URL（NDJSON、`Content-Encoding: gzip` を付与、5分有効）"
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Snowflake 未設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stats/sims/current_plan_usage:
    get:
      tags: [Statistics]
      summary: 全 SIM 現プラン消費量
      description: |
        顧客の全 SIM の「現プランでの消費量」を一括取得します。

        各 SIM の `current_plan_used_bytes` は、累積通信量 (`total_bytes`)
        から最新の Executed リチャージ予約の `usage_offset_bytes` を引いた
        値です。`usage_offset_bytes` が記録されていない SIM では
        `current_plan_used_bytes` は `null` を返します。
      operationId: ListCurrentPlanUsage
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrentPlanUsage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Snowflake 未設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stats/sims/{sim_id}/current_plan_usage:
    get:
      tags: [Statistics]
      summary: SIM 現プラン消費量
      description: |
        特定 SIM の「現プランでの消費量」を取得します。

        `current_plan_used_bytes` は、累積通信量 (`total_bytes`) から
        最新の Executed リチャージ予約の `usage_offset_bytes` を引いた
        値です。`usage_offset_bytes` が記録されていない場合は `null` を
        返します。
      operationId: GetSimCurrentPlanUsage
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrentPlanUsage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Snowflake 未設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stats/sims/{sim_id}/monthly_usage:
    get:
      tags: [Statistics]
      summary: SIM 別月次通信量
      description: |
        特定 SIM の月次通信量を取得します（直近12ヶ月分、year_month 降順）。

        ⚠️ **SIM 再発行が発生した月は、同一 `year_month` に複数行が返ります**（`旧SIM` / `新SIM` / `合計行` の 3 行のうち、その SIM の Inventory 配下にあたるもの）。**`合計行`（旧 + 新の合算行）を含むため、単純合計すると二重計上になります。** 各行の区別は `reissue_category` を参照してください。

        ⚠️ 集計 EP の `/v1/stats/sims/monthly_usage` は逆に `合計行` を除外しており、**本 EP が `合計行` を含む・集計 EP は除外する、という非対称は意図的**です（本 EP は生の実績を、集計 EP は請求根拠となる合算値を返すため）。
      operationId: GetSimMonthlyUsage
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimMonthlyUsage"
              example:
                - sim_id: "SIM001"
                  customer_code: "110139701"
                  year_month: "202603"
                  downlink_bytes: 1000000000
                  uplink_bytes: 300000000
                  reissue_category: null
                - sim_id: "SIM001"
                  customer_code: "110139701"
                  year_month: "202604"
                  downlink_bytes: 1500000000
                  uplink_bytes: 450000000
                  reissue_category: "total"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /stats/sims/{sim_id}/daily_usage:
    get:
      tags: [Statistics]
      summary: SIM 別日次通信量
      description: |
        特定 SIM の日別通信量を取得します（date 降順）。

        - 対象期間は **JST の前日を終端とする直近 `days` 日**です。当日分は日次バッチへ未反映のため含まれません。当日分が必要な場合は `/stats/sims/{sim_id}/details` を利用してください。
        - **通信のない日も 0 バイトの行として返却**されるため、実績のある SIM なら常に `days` 件が返ります。
        - **期間を明示したい場合は `start_date` / `end_date`（`YYYY-MM-DD`, JST）を指定**します（`days` と同時指定は 400）。片方だけの指定は 400 です。`end_date` は集計終端の **JST 前日にクランプ**されるため、本日や未来日を指定してもエラーにならず、前日までの行が返ります。`start_date` は JST 前日以前で、かつ今日から 31 日以内の日付である必要があります。
        - `from` / `to` クエリは受け付けません（400）。命名はリポジトリ規約に合わせて `start_date` / `end_date` を使ってください。
        - **404 になるのは、指定 `customer_code` 配下に当該 SIM の通信実績レコードが 1 件も存在しない場合**です。SIM 自体は存在しても一度も通信していなければ 404 になります。「SIM が存在しない」ことの判定には使えません。
        - `data_through` は日次集計が確定している最終日、`checked_at` は集計を実行した時刻です。本 API の他の日時と同様に **UTC 表記（`...Z`）** で返ります。

        ### `is_confirmed` の意味と `in_bytes = 0` の解釈

        `is_confirmed` は該当日の値の確定度を示します。**`false` かつ 0 バイトの行は、`date` と `checked_at` の差によって意味が変わります。**

        ⚠️ `date` は **JST の日付**、`checked_at` は **UTC 表記の日時**です。下の判定を行うときは、`checked_at` を JST（UTC + 9 時間）に変換してから日付を比較してください。UTC のまま日付を取ると、JST の 00:00〜09:00 に集計された行で 1 日ずれます。

        - `true`: 日次集計（1DAY）が反映済みの確定値です。`0` も含めて実測値です。
        - `false`: 日次集計が未反映の日です。値の意味は次のとおりです。
          - **`date` が「`checked_at` を JST に変換した日付」の前日以降**: 5 分粒度集計（5MINS）からの速報値です。`0` より大きい値は実測値で、取り込みの進行に伴い微増する可能性があります。`0` は 5MINS にも記録が無い日です。
          - **`date` がそれより古い**: 5MINS による補完の対象外の日です（補完には直近 24 時間に取り込まれた 5MINS レコードのみを使用します）。**この場合の `0` は「通信が無かった」ことを意味しません。値が不明なものとして扱い、残量計算の入力にしないでください。**

        日次バッチ（00:15 JST）が正常であれば、通常は前日以前のすべての日が `true` になります。`false` の日が 2 日以上連続する場合は集計パイプラインの停止を疑ってください。

        ### 「真の 0」に見えるが実データがある 2 つのケース

        次の 2 つは `downlink_bytes` / `uplink_bytes` が `0` かつ `is_confirmed: true` で返るため、**上の `is_confirmed` の分岐では検出できません。** どちらも「無通信」ではないので、無通信と断定する前に確認してください。

        **1. 顧客コードの付け替え（商流変更）**

        使用量データの `customer_code` は**契約時点の値で、遡及修正されません**。SIM が別の顧客コードへ付け替えられた場合、**新しい顧客コードで問い合わせると付け替え前の日が `0`、古い顧客コードで問い合わせると付け替え後の日が `0`** になります。期間をまたぐ場合は、両方の顧客コードで取得して突き合わせる必要があります。

        **2. MSISDN の付け替え**

        日別の集計は **MSISDN を基準に結合**しています。同一顧客内で SIM の MSISDN が付け替えられた場合、**付け替え前の日が `0`** になります。逆に、ある MSISDN が別の SIM に再利用されていると、その期間の実績が合算されることがあります。
      operationId: GetSimDailyUsage
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - name: days
          in: query
          required: false
          description: |
            取得する日数（JST 前日を終端とする直近 N 日）。
            `start_date` / `end_date` と同時指定はできません（400）。
          schema:
            type: integer
            default: 3
            minimum: 1
            maximum: 31
        - name: start_date
          in: query
          required: false
          description: |
            期間の開始日（JST, `YYYY-MM-DD`）。`end_date` と一組で指定してください。
            `days` との同時指定・片方だけの指定は 400 です。
            **JST 本日以降、`end_date` より後、および今日から 31 日を超えて過去の日は 400** になります
            （集計終端は JST 前日のため、本日以降を指定しても意味のある結果が返らないので誤解を招く 404 ではなく 400 で弾きます）。
            形式は `YYYY-MM-DD` のみ受け付けます (basic 形式 `20260821` や週日付 `2026-W34-1` は 400)。
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          description: |
            期間の終了日（JST, `YYYY-MM-DD`）。`start_date` と一組で指定してください。
            集計終端は常に JST 前日のため、**本日以降を指定すると JST 前日にクランプ**されます（エラーにはしません）。
            これにより「過去 1 か月 (`start_date = today - 31`, `end_date = today`)」のような素直な指定も通ります。
            形式は `YYYY-MM-DD` のみ受け付けます。
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimDailyUsage"
              example:
                - sim_id: "8981080301013111404"
                  msisdn: "812001033859274"
                  customer_code: "110139701"
                  date: "2026-08-24"
                  downlink_bytes: 77597
                  uplink_bytes: 278985
                  total_bytes: 356582
                  is_confirmed: true
                  checked_at: "2026-08-25T04:24:10Z"
                  data_through: "2026-08-24"
                - sim_id: "8981080301013111404"
                  msisdn: "812001033859274"
                  customer_code: "110139701"
                  date: "2026-08-23"
                  downlink_bytes: 0
                  uplink_bytes: 0
                  total_bytes: 0
                  is_confirmed: true
                  checked_at: "2026-08-25T04:24:10Z"
                  data_through: "2026-08-24"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: |
            クエリパラメータの型変換エラー (例: `days=abc`)。
            FastAPI が範囲チェックより先に型変換を実行するため、`days` に整数化できない値を渡すと 400 ではなく 422 を返します。
            なお `start_date` / `end_date` は文字列で受けてアプリ側でパースするため、
            形式不正 (例: `start_date=abc`) は 422 ではなく **400** になります。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Snowflake 未設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stats/sims/{sim_id}/daily_usage/export:
    get:
      tags: [Statistics]
      summary: SIM 別日次通信量 CSV エクスポート
      description: |
        `GET /v1/stats/sims/{sim_id}/daily_usage` と同じデータを CSV でエクスポートし、
        S3 に配置してプリサインド URL を返します（同期・24 時間有効）。

        - **期間指定 (`start_date` / `end_date`) は必須**です。`days` 指定はできません。
          期間の規則は同期 EP と同一で、**`start_date` は JST 前日以前かつ今日から 31 日以内**、
          `end_date` は集計終端の JST 前日にクランプされます。詳細は同期 EP の description を参照。
        - **0 件でも 200 + ヘッダのみ CSV を返します**（同期 EP は 404）。ダウンロード URL が
          必ず返る運用にするため。仕様の非対称は意図的です。
        - `data_through` は応答 JSON に**1 度だけ**含めます（全行同値のため CSV 列に持たせません）。
          0 件の場合は `null` になります。
        - **時計ずれ検出は同期 EP と同じ**で、期待行数を下回ると **500** を返します。
          「実績なし」の空 CSV に化けないようにするための保険で、リトライで解消します。
        - `days` / `from` / `to` クエリは受け付けません（400）。
        - 日次データは統計基盤側で生成するため `/v1/stats/` 配下に置いています。

        ### CSV 列 (英字ヘッダ、date 降順)

        ```
        date,sim_id,msisdn,uplink_bytes,downlink_bytes,total_bytes,is_confirmed
        ```

        - `is_confirmed` は `true` / `false` 文字列です。
        - `sim_id` を含めるのは CSV を単体で扱っても対象 SIM が特定できるようにするためです。
      operationId: ExportSimDailyUsage
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - name: start_date
          in: query
          required: true
          description: |
            期間の開始日（JST, `YYYY-MM-DD`）。同期 EP と同じ規則で、
            JST 本日以降・`end_date` より後・今日から 31 日超の日は 400。
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          description: |
            期間の終了日（JST, `YYYY-MM-DD`）。集計終端は JST 前日なので、
            本日・未来を指定しても JST 前日にクランプされます。
          schema:
            type: string
            format: date
        - name: format
          in: query
          required: false
          description: 出力フォーマット（当面 `csv` のみ）。
          schema:
            type: string
            enum: [csv]
            default: csv
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功（CSV を S3 に配置しダウンロード URL を返す。0 件でも 200 + ヘッダのみ CSV）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimDailyUsageExport"
              example:
                file_name: "daily_usage_110139801_8981080301013111404_20260801_20260824_0f1e2d3c4b5a6978a9bcdef012345678.csv"
                row_count: 24
                download_url: "https://mc-prod-exports.s3.ap-northeast-1.amazonaws.com/daily_usage_...?X-Amz-Signature=..."
                expires_in_seconds: 86400
                data_through: "2026-08-24"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: |
            サーバー内部エラー。**期間指定時に API と Snowflake の「今日」が JST 00:00 を跨いでずれた**
            ときも 500 を返します（詳細メッセージ: `Clock skew detected between API and Snowflake; please retry`）。
            リトライで解消します。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Snowflake 未設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stats/sims/{sim_id}/details:
    get:
      tags: [Statistics]
      summary: SIM CDR（通信明細）
      description: 特定 SIM の通信明細（CDR）を取得します。直近 288 件（5 分粒度。連続してデータがある場合で約 24 時間分）のレコードが返却されます。
      operationId: GetSimUsageDetails
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CdrRecord"
              example:
                - sim_id: "SIM001"
                  customer_code: "110139701"
                  record_begins_at: "2026-03-06T10:30:00Z"
                  downlink_bytes: 50000000
                  uplink_bytes: 10000000
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /stats/sims/{sim_id}/cumulative_usage:
    get:
      tags: [Statistics]
      summary: 累積通信量
      description: |
        特定 SIM の累積通信量を取得します。日次で更新されます。

        ⚠️ **Snowflake 未設定時の RDS フォールバック経路では、SIM 再発行月の `合計行`（旧 + 新 の合算行）を除外せずに `SUM()` しています**。該当月分が二重計上されます。集計 EP の `/v1/stats/sims/monthly_usage` は除外済みで、**本 EP は未対応**という非対称が残っています（本 PR のスコープ外。[#110](https://github.com/misora-connect/mc-api/issues/110) で追跡）。
      operationId: GetSimCumulativeUsage
      parameters:
        - name: sim_id
          in: path
          required: true
          description: SIM 識別子
          schema:
            type: string
        - $ref: "#/components/parameters/CustomerCode"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CumulativeUsage"
              example:
                - sim_id: "8981080301011098470"
                  customer_code: "120070301"
                  msisdn: "8180000000000"
                  downlink_bytes: 50000000000
                  uplink_bytes: 15000000000
                  total_bytes: 65000000000
                  checked_at: "2026-08-14T06:45:49Z"
                  latest_record_time: "2026-08-14T06:40:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===== Exports =====
  /exports:
    get:
      tags: [Exports]
      summary: エクスポート種別一覧
      description: 利用可能なエクスポート種別の一覧を取得します。
      operationId: ListExports
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  exports:
                    type: array
                    items:
                      type: string
              example:
                exports: ["sims", "monthly_usage_by_sim"]

  /exports/sims:
    post:
      tags: [Exports]
      summary: SIM データエクスポート
      description: |
        SIM データのエクスポートをリクエストします。

        - **非同期モード**（デフォルト）: 即座に署名付きダウンロード URL を返却し、バックグラウンドで処理を実行します。
        - **同期モード**: 処理完了まで待機します。

        解約済み SIM は除外されます。
      operationId: CreateSimsExport
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - name: format
          in: query
          description: 出力形式
          schema:
            type: string
            default: csv
            enum: [csv, json, jsonl]
        - name: async
          in: query
          description: "`true`: 非同期処理（即時レスポンス）、`false`: 同期処理（完了待ち）"
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExportAsync"
                  - $ref: "#/components/schemas/ExportSync"
              examples:
                async:
                  summary: 非同期レスポンス
                  value:
                    file_name: "sims_export_110139801_01KABHF5NQGE8S4AT877421K6J.csv"
                    download_url: "https://mc-prod-exports.s3.amazonaws.com/..."
                    message: "Export is being processed. The file will be available shortly at the download URL."
                    expires_in_seconds: 86400
                sync:
                  summary: 同期レスポンス
                  value:
                    file_name: "sims_export_110139801_01KABHF5NQGE8S4AT877421K6J.csv"
                    row_count: 70
                    file_size_bytes: 29151
                    s3_url: "s3://mc-prod-exports/sims_export_110139801_..."
                    download_url: "https://mc-prod-exports.s3.amazonaws.com/..."
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /exports/monthly_usage_by_sim:
    post:
      tags: [Exports]
      summary: 月次利用実績 CSV エクスポート (SIM 別)
      description: |
        指定月の SIM 別月次利用実績を CSV でエクスポートします。misora-central の
        US-027（月次利用実績 CSV 出力）が消費する EP です。

        - **非同期モード**（デフォルト）: 即座に署名付きダウンロード URL を返却し、バックグラウンドで処理します。
        - **同期モード**: 処理完了まで待機します。

        CSV は 7 列固定・**英字ヘッダ**で以下の順に出力されます。

        | 列 | 型 | 内容 |
        | --- | --- | --- |
        | `year_month` | string | `YYYYMM` |
        | `sim_id` | string | 既存 SIM EP と同じ ID（ICCID とは限らない） |
        | `msisdn` | string | 電話番号 |
        | `reissue_category` | string | 再発行区分。`new`（新 SIM）/ `old`（旧 SIM）/ `total`（合計行）。再発行の無い通常行は空 |
        | `uplink_bytes` | integer | 上り通信量（生バイト、0 埋め） |
        | `downlink_bytes` | integer | 下り通信量（生バイト、0 埋め） |
        | `total_bytes` | integer | `uplink_bytes + downlink_bytes`（サーバ側計算） |

        - 実績 0 件は 200 + ヘッダのみの CSV を返します（「その月に実績が無い」は正常な結果）。
        - 再発行月は「旧 SIM / 新 SIM / 合計」の 3 行が並びます。`exclude_total=true` を渡すと Salesforce が入れる合計行（`reissue_category='total'`）を除外できます。
      operationId: CreateMonthlyUsageBySimExport
      parameters:
        - $ref: "#/components/parameters/CustomerCode"
        - name: year_month
          in: query
          required: true
          description: 対象月 `YYYYMM`（6 桁）
          schema:
            type: string
            pattern: '^\d{6}$'
          example: "202608"
        - name: exclude_total
          in: query
          description: |
            Salesforce が再発行月に入れる合計行（`reissue_category='total'`）を除外します。
            旧 SIM 行と新 SIM 行はそのまま残ります。既定 `false`。
          schema:
            type: boolean
            default: false
        - name: format
          in: query
          description: 出力形式（CSV のみ）
          schema:
            type: string
            default: csv
            enum: [csv]
        - name: async
          in: query
          description: "`true`: 非同期処理（即時レスポンス）、`false`: 同期処理（完了待ち）"
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExportAsync"
                  - $ref: "#/components/schemas/ExportSync"
              examples:
                async:
                  summary: 非同期レスポンス
                  value:
                    file_name: "monthly_usage_by_sim_110139801_202608_01KABHF5NQGE8S4AT877421K6J.csv"
                    download_url: "https://mc-prod-exports.s3.amazonaws.com/..."
                    message: "Export is being processed. The file will be available shortly at the download URL."
                    expires_in_seconds: 86400
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

