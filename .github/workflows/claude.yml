name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

jobs:
  claude:
    if: |
      contains(github.event.comment.body || github.event.issue.body, '@claude')
    runs-on: [self-hosted, colima]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Clean up Docker-generated files
        run: sudo rm -rf _site

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-1
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          use_bedrock: "true"
          claude_args: |
            --model global.anthropic.claude-opus-4-6-v1

      - name: Generate GitHub App token for PR creation
        if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLAUDE_PR_APP_ID }}
          private-key: ${{ secrets.CLAUDE_PR_APP_PRIVATE_KEY }}

      - name: Open PR for the created branch
        if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null)
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const branch = process.env.BRANCH;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!branch) {
              core.info('No branch created by Claude; skipping PR creation.');
              return;
            }
            const { owner, repo } = context.repo;

            // Collect Claude's report from issue comments to use as PR body.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const claudeComments = comments.filter(
              (c) => c.user && c.user.login === 'claude[bot]' && c.body,
            );
            const latestClaude = claudeComments[claudeComments.length - 1];
            const stripSignature = (body) =>
              body
                // Remove the "**Claude finished ...** —— [View job]... • [Create PR ➔](...)" line.
                .replace(/^\*\*Claude finished[^\n]*\n?/gm, '')
                // Remove trailing "[View job](...) • [`branch`](...)" style footers.
                .replace(/\n?\[View job\]\([^)]+\)[^\n]*$/gm, '')
                // Collapse the horizontal rule left behind after removing the header.
                .replace(/^---\s*\n/, '')
                .trim();
            const reportBody = latestClaude
              ? stripSignature(latestClaude.body)
              : '';
            const prBody = reportBody
              ? `${reportBody}\n\nCloses #${issueNumber}`
              : `Closes #${issueNumber}`;

            let pr;
            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
            });
            if (existing.length > 0) {
              pr = existing[0];
              core.info(`PR already open for ${branch}: #${pr.number}`);
            } else {
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });
              const created = await github.rest.pulls.create({
                owner,
                repo,
                head: branch,
                base: 'main',
                title: issue.title,
                body: prBody,
              });
              pr = created.data;
              core.info(`Created PR #${pr.number}: ${pr.html_url}`);
            }

            // Rewrite Claude's "Create PR ➔" links in this issue's comments
            // to point at the actual PR that now exists.
            const replacement = `[PR #${pr.number} ➔](${pr.html_url})`;
            const createPrLinkPattern = /\[Create PR ➔\]\(https:\/\/github\.com\/[^)]+\)/g;
            for (const c of comments) {
              if (!c.body || !createPrLinkPattern.test(c.body)) continue;
              createPrLinkPattern.lastIndex = 0;
              const newBody = c.body.replace(createPrLinkPattern, replacement);
              if (newBody === c.body) continue;
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: c.id,
                body: newBody,
              });
              core.info(`Rewrote Create PR link in comment ${c.id}`);
            }
