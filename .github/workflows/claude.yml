name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

jobs:
  claude:
    if: |
      contains(github.event.comment.body || github.event.issue.body, '@claude')
    runs-on: [self-hosted, colima]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Clean up Docker-generated files
        run: sudo rm -rf _site

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-1
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          use_bedrock: "true"
          claude_args: |
            --model global.anthropic.claude-opus-4-6-v1

      - name: Open PR for the created branch
        if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null)
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!branch) {
              core.info('No branch created by Claude; skipping PR creation.');
              return;
            }
            const { owner, repo } = context.repo;
            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
            });
            if (existing.length > 0) {
              core.info(`PR already open for ${branch}; skipping.`);
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title: issue.title,
              body: `Closes #${issueNumber}`,
            });
            core.info(`Created PR #${pr.number}: ${pr.html_url}`);
