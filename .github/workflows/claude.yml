name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

jobs:
  claude:
    if: |
      contains(github.event.comment.body || github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          ANTHROPIC_BEDROCK_BASE_URL: https://bedrock-runtime.ap-northeast-1.amazonaws.com
          ANTHROPIC_MODEL: ap-northeast-1.anthropic.claude-opus-4-6-20260610-v1:0
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_REGION: ap-northeast-1
